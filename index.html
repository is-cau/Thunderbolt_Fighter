<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Thunderbolt Fighter - 雷霆战机</title>
<style>
:root {
  --ink:#000000;
  --night:#12263F;
  --night-deep:#0B1626;
  --paper:#F2EFE8;
  --cream:#FFE98A;
  --sun:#FFD23F;
  --coral:#FF7A3C;
  --coral-dark:#C7471B;
  --mint:#35D0C0;
  --sky:#3FD0F0;
  --violet:#8B6EF2;
  --line:rgba(0,0,0,.35);
  --shadow:#000000;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; height:100dvh; overflow:hidden;
  background:var(--night-deep);
  color:var(--paper);
  font-family:'Trebuchet MS','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none; touch-action:none;
  -webkit-overflow-scrolling:none; position:fixed; inset:0;
}
button { font:inherit; }
body { display:flex; justify-content:center; align-items:center; }
#game-wrapper {
  position:relative; width:100vw; height:100vh; height:100dvh;
  display:flex; justify-content:center; align-items:center; overflow:hidden;
  background-color:var(--night-deep);
  background-image:linear-gradient(160deg, #0B1626 0 42%, #12263F 42% 70%, #1B3355 70% 100%);
}
#game-wrapper::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
  box-shadow:inset 0 0 0 3px #000000;
}
.paint-grain {
  position:absolute; inset:-20%; z-index:3; pointer-events:none; opacity:.5;
  background-image:
    repeating-linear-gradient(45deg, rgba(242,239,232,.045) 0 1px, transparent 1px 16px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.06) 0 1px, transparent 1px 16px);
  mix-blend-mode:normal;
}
#gameCanvas {
  position:absolute; display:block;
  width:min(100vw, calc(100dvh * 1.6667));
  height:min(100dvh, calc(100vw * .6));
  image-rendering:auto; z-index:1;
}
.screen {
  position:absolute; inset:0; z-index:20; display:flex;
  align-items:center; justify-content:center; overflow:hidden;
}
.screen::before {
  content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:
    repeating-linear-gradient(45deg, rgba(242,239,232,.06) 0 1px, transparent 1px 18px),
    repeating-linear-gradient(-45deg, rgba(242,239,232,.06) 0 1px, transparent 1px 18px);
}
#start-screen {
  background-color:#0B1626;
  background-image:linear-gradient(165deg, #0B1626 0 55%, #12263F 55% 78%, #1B3355 78% 100%);
}
#start-screen::after {
  content:''; position:absolute; left:-8%; right:-8%; bottom:-12vh; height:37vh;
  background-color:#12263F;
  opacity:.9; transform:rotate(-3deg) skewX(-14deg); border-top:4px solid #000000; pointer-events:none;
}
.start-layout {
  position:relative; z-index:1; width:min(940px, 92vw); height:min(520px, 90dvh);
  display:grid; grid-template-columns:minmax(290px,1.08fr) minmax(260px,.92fr);
  align-items:center; gap:clamp(24px,5vw,72px);
}
.brand-block { align-self:center; }
.eyebrow {
  display:inline-flex; align-items:center; gap:8px; margin-bottom:12px;
  color:var(--mint); font-size:12px; font-weight:900; text-transform:uppercase;
  letter-spacing:2px;
}
.eyebrow::before { content:'◆'; color:var(--sun); font-size:13px; }
#start-screen h1 {
  max-width:520px; color:#F2EFE8; font-family:'YouYuan','STHupo','Microsoft YaHei',sans-serif;
  font-size:clamp(52px,7vw,86px); line-height:.96; letter-spacing:0;
  -webkit-text-stroke:3px #000000;
  text-shadow:5px 5px 0 #000000;
}
#start-screen h1 span { display:block; color:#FFD23F; -webkit-text-stroke:3px #000000; text-shadow:5px 5px 0 #000000; }
#start-screen .subtitle {
  margin-top:13px; color:rgba(242,239,232,.8); font-size:14px;
  font-weight:800; letter-spacing:3px; text-transform:uppercase;
}
.mission-note {
  display:flex; align-items:center; gap:10px; margin-top:28px;
  color:var(--ink); background:var(--paper); width:max-content; max-width:100%;
  padding:9px 13px; border:3px solid #000000; border-radius:0;
  box-shadow:4px 4px 0 #000000; font-size:13px; font-weight:800;
}
.mission-note b { color:var(--coral-dark); }
.launch-bay { display:flex; flex-direction:column; align-items:center; position:relative; }
.mascot-stage {
  position:relative; width:210px; height:210px; display:grid; place-items:center;
  background:#12263F;
  clip-path:polygon(29% 0, 71% 0, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0 71%, 0 29%);
}
.mascot-stage::before {
  content:''; position:absolute; inset:-6px; z-index:-1; background:#000000;
  clip-path:polygon(29% 0, 71% 0, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0 71%, 0 29%);
}
.mascot-stage::after { content:none; }
.mascot-stage .orbit-line::before, .mascot-stage .orbit-line::after {
  content:'◆'; position:absolute; color:var(--sun); font-size:20px; animation:twinkle 1.8s ease-in-out infinite;
}
.mascot-stage .orbit-line::before { left:-38px; top:-44px; }
.mascot-stage .orbit-line::after { right:-36px; bottom:-40px; color:var(--sky); animation-delay:.8s; }
.orbit-line { position:absolute; width:250px; height:76px; border:1.5px solid rgba(53,208,192,.55); border-radius:0; transform:rotate(-12deg) skewX(-8deg); }
#start-screen .ship-preview {
  width:136px; height:136px; z-index:1; animation:float 2.2s ease-in-out infinite;
}
.primary-action, .secondary-action {
  pointer-events:auto; cursor:pointer; min-height:48px; border-radius:0;
  border:3px solid #000000; font-weight:900; letter-spacing:0;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.primary-action {
  margin-top:25px; min-width:220px; padding:12px 26px; color:var(--ink);
  background-color:var(--sun);
  box-shadow:4px 4px 0 #000000;
  font-size:18px;
}
.primary-action::before { content:'◆'; margin-right:10px; font-size:12px; }
.primary-action:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 #000000; filter:saturate(1.08); }
.primary-action:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #000000; }
.control-strip { display:flex; gap:10px; margin-top:19px; color:rgba(242,239,232,.78); font-size:11px; font-weight:900; }
.control-strip span { display:flex; align-items:center; gap:6px; }
.keycap { min-width:24px; padding:3px 6px; border:1px solid #000000; border-bottom-width:3px; border-radius:0; color:var(--ink); background:rgba(242,239,232,.9); text-align:center; }
@keyframes float { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-11px) rotate(1deg)} }
@keyframes twinkle { 0%,100%{transform:scale(.72) rotate(0);opacity:.45} 50%{transform:scale(1.12) rotate(20deg);opacity:1} }
@keyframes star-drift { to{background-position:53px 49px} }

#game-tools {
  position:absolute; top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right));
  z-index:12; display:none; gap:8px;
}
.icon-button {
  position:relative; width:38px; height:38px; display:grid; place-items:center;
  border:2px solid #000000; border-radius:0; cursor:pointer;
  background:rgba(18,38,63,.95); color:var(--paper); font-size:17px; font-weight:900;
  transition:transform .15s, background .15s, color .15s;
}
.icon-button:hover { background:var(--paper); color:var(--ink); transform:translateY(-2px); }
.icon-button::after {
  content:attr(data-tooltip); position:absolute; top:46px; right:0; pointer-events:none;
  padding:5px 7px; border-radius:0; white-space:nowrap; background:var(--ink); color:var(--paper);
  border:1px solid #000000;
  font-size:10px; opacity:0; transform:translateY(-3px); transition:.15s;
}
.icon-button:hover::after { opacity:1; transform:translateY(0); }

#gameover-screen, #pause-overlay { display:none; background:rgba(11,22,38,.88); }
.result-panel, .pause-panel {
  position:relative; z-index:1; width:min(430px, 88vw); padding:32px 34px 30px;
  color:var(--ink); background-color:var(--paper);
  border:4px solid #000000; border-radius:0;
  box-shadow:8px 8px 0 #000000; text-align:center;
}
.result-stamp {
  position:absolute; top:-20px; right:24px; width:64px; height:64px; display:grid; place-items:center;
  border:3px solid #000000; border-radius:0; color:var(--ink); background:var(--sun);
  font-size:24px; transform:rotate(8deg); box-shadow:3px 3px 0 #000000;
}
#gameover-screen h2, #pause-overlay h2 {
  color:var(--ink); font-family:'YouYuan','STHupo','Microsoft YaHei',sans-serif;
  font-size:34px; letter-spacing:0; margin-bottom:6px;
}
.result-label, .pause-label { color:var(--coral-dark); font-size:11px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
#gameover-screen .final-score { margin-top:20px; color:var(--coral-dark); font-size:38px; font-weight:900; }
#gameover-screen .stats { margin:8px 0 25px; color:rgba(0,0,0,.67); font-size:13px; font-weight:800; }
.result-actions, .pause-actions { display:flex; justify-content:center; gap:10px; margin-top:23px; }
.result-actions .primary-action, .pause-actions .primary-action { margin-top:0; min-width:160px; }
.secondary-action { min-height:44px; padding:9px 16px; color:var(--ink); background:transparent; font-size:14px; }
.secondary-action { border-width:3px; }
.secondary-action:hover { background-color:rgba(53,208,192,.18); transform:translateY(-2px); }
#restart-btn { margin-top:0; min-width:180px; }
.pause-emblem { width:70px; height:70px; display:grid; place-items:center; margin:0 auto 16px; border-radius:0; background:var(--mint); border:3px solid #000000; color:var(--ink); font-size:26px; font-weight:900; box-shadow:4px 4px 0 #000000; }
.pause-sub { margin-top:8px; color:rgba(0,0,0,.6); font-size:12px; font-weight:800; }

#rotate-hint {
  display:none; position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
  z-index:210; background-color:#0B1626;
  background-image:linear-gradient(165deg, #0B1626 0 55%, #12263F 55% 78%, #1B3355 78% 100%);
  flex-direction:column; justify-content:center; align-items:center;
  color:var(--paper); pointer-events:none; text-align:center; padding:30px;
}
#rotate-hint .rotate-device { position:relative; width:68px; height:108px; margin-bottom:28px; border:4px solid #000000; border-radius:0; background:rgba(242,239,232,.9); box-shadow:5px 5px 0 #000000; animation:turn-device 2.4s ease-in-out infinite; }
#rotate-hint .rotate-device::before { content:'◆'; position:absolute; inset:0; display:grid; place-items:center; color:var(--sun); font-size:28px; }
#rotate-hint p { font-family:'YouYuan','Microsoft YaHei',sans-serif; font-size:28px; font-weight:900; letter-spacing:0; }
#rotate-hint .rotate-sub { margin-top:10px; color:var(--mint); font-size:13px; font-weight:800; }
@keyframes turn-device { 0%,20%{transform:rotate(0)} 55%,85%{transform:rotate(90deg)} 100%{transform:rotate(0)} }
@media (orientation:portrait){#rotate-hint{display:flex}}
@media (orientation:landscape){#rotate-hint{display:none}}
@media (max-width:760px), (max-height:520px) {
  .start-layout { width:min(760px,92vw); height:92dvh; grid-template-columns:1fr 1fr; gap:18px; }
  #start-screen h1 { font-size:clamp(34px,8vw,54px); }
  #start-screen .subtitle { margin-top:8px; font-size:10px; letter-spacing:2px; }
  .eyebrow { margin-bottom:7px; font-size:9px; }
  .mission-note { margin-top:16px; padding:7px 10px; font-size:10px; }
  .mascot-stage { width:132px; height:132px; }
  .orbit-line { width:164px; height:54px; }
  #start-screen .ship-preview { width:88px; height:88px; }
  .primary-action { min-width:166px; min-height:40px; margin-top:13px; padding:8px 16px; font-size:14px; }
  .control-strip { margin-top:11px; font-size:9px; }
  .result-panel,.pause-panel { width:min(400px,84vw); padding:20px 26px; }
  #gameover-screen h2,#pause-overlay h2 { font-size:25px; }
  #gameover-screen .final-score { margin-top:10px; font-size:29px; }
  #gameover-screen .stats { margin-bottom:14px; }
  .result-actions,.pause-actions { margin-top:13px; }
  .pause-emblem { width:48px; height:48px; margin-bottom:8px; font-size:18px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
</style>
</head>
<body>
<!-- 竖屏旋转提示 -->
<div id="rotate-hint">
  <div class="rotate-device" aria-hidden="true"></div>
  <p>转个身，再出发</p>
  <div class="rotate-sub">横屏任务舱已准备好</div>
</div>
<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <div class="paint-grain" aria-hidden="true"></div>
  <div id="game-tools" aria-label="游戏工具">
    <button class="icon-button" id="sound-btn" type="button" data-tooltip="静音" aria-label="静音" aria-pressed="false" onclick="toggleSound()">♪</button>
    <button class="icon-button" id="pause-btn" type="button" data-tooltip="暂停" aria-label="暂停游戏" onclick="togglePause()">Ⅱ</button>
  </div>
  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <div class="start-layout">
      <div class="brand-block">
        <div class="eyebrow">喵航局 · 今日特派</div>
        <h1>雷霆<span>小飞喵</span></h1>
        <div class="subtitle">Thunderbolt Kitty Express</div>
        <div class="mission-note"><b>NO. 0724</b><span>星星包裹正在等待派送</span></div>
      </div>
      <div class="launch-bay">
        <div class="mascot-stage">
          <div class="orbit-line" aria-hidden="true"></div>
          <canvas class="ship-preview" id="previewCanvas" width="160" height="160"></canvas>
        </div>
        <button id="start-btn" class="primary-action" type="button" onclick="handleStartClick()">开始派送</button>
        <div class="control-strip" id="start-hint">
          <span><i class="keycap">WASD</i>移动</span>
          <span><i class="keycap">P</i>暂停</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Game Over Screen -->
  <div id="gameover-screen" class="screen">
    <div class="result-panel">
      <div class="result-stamp" aria-hidden="true">★</div>
      <div class="result-label">Delivery Report</div>
      <h2>本次派送完成</h2>
      <div class="final-score" id="final-score">0 分</div>
      <div class="stats" id="final-stats">抵达第 1 波 · 最大连击 0x</div>
      <div class="result-actions">
        <button class="secondary-action" type="button" onclick="returnToTitle()">返回基地</button>
        <button id="restart-btn" class="primary-action" type="button" onclick="handleRestartClick()">再次出发</button>
      </div>
    </div>
  </div>
  <!-- Pause -->
  <div id="pause-overlay" class="screen">
    <div class="pause-panel">
      <div class="pause-emblem" aria-hidden="true">Ⅱ</div>
      <div class="pause-label">Rest Stop</div>
      <h2>歇一小会儿</h2>
      <div class="pause-sub">飞船和爪爪都已停稳</div>
      <div class="pause-actions">
        <button class="secondary-action" type="button" onclick="returnToTitle()">返回基地</button>
        <button class="primary-action" type="button" onclick="togglePause()">继续派送</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================================
// THUNDERBOLT FIGHTER — 雷霆战机 (Cute Edition)
// Single-file HTML5 Canvas game. All sprites & sounds are procedural.
// ============================================================================

// ============================================================================
// SECTION 1: CONSTANTS & GAME STATE
// ============================================================================
const CANVAS_W = 800, CANVAS_H = 480;
const DPR = Math.min(window.devicePixelRatio || 1, 2); // 高DPI渲染，上限2x保证性能
const COLORS = {
  pink:'#FF9E7A', hotPink:'#FF5C38', mint:'#35D0C0', lavender:'#8B6EF2',
  peach:'#FFB08A', butter:'#FFD23F', coral:'#FF7A3C', skyBlue:'#3FD0F0',
  purple:'#5F45C4', gold:'#FFD23F', white:'#FFFFFF', darkPurple:'#141B2E',
  starYellow:'#FFE98A', darkMint:'#1B9488', deepBlue:'#0B1626',
  darkPink:'#C7471B', softWhite:'#F2EFE8', charcoal:'#000000',
  blushPink:'#FFC7A8', roseGold:'#E86A3C', skyLight:'#9BE8FF', berry:'#8A2E3B',
  // Low-poly palette additions
  bgDeep:'#0B1626', bgMid:'#12263F', bgHigh:'#1B3355',
  hostile:'#FF4D6D', hostileDeep:'#C22E4E', outline:'#000000'
};

const GAME = {
  player:null, enemies:[], enemyBullets:[], playerBullets:[],
  particles:[], powerUps:[], comboTexts:[],
  score:0, combo:0, maxCombo:0, wave:1, waveTimer:0,
  gameState:'start', // start|playing|paused|gameover
  screenShake:0, screenShakeDuration:0, flashAlpha:0,
  slowMotion:1, slowMotionTimer:0,
  bossActive:false, bossWarning:0, bossWarningTimer:0,
  time:0, dt:0,
  // Mouse
  mouseX:240, mouseY:400, mouseOnCanvas:false,
  // Auto-trigger special effects
  autoEffectTimer:0, autoEffectInterval:3, // seconds between auto effects
  activeEffect:null, effectDisplayName:'', effectTimer:0, // currently active effect
  lightningChains:[], // up to 3 concurrent lightning chains [{timer,enemies}]
  effectLightning:[], effectMeteors:[], // effect data arrays
  _effectCooldowns:{lightning:0,sweep:0,burst:0,meteor:0,scatter:0,sideShot:0,iceStorm:0,laserSweep:0},
  _lightningBaseCooldown:1.0,
  upgradeLevel:0, // score milestones: bullet damage = 1 + upgradeLevel
  iceStormActive:false, iceStormTimer:0, // freeze effect
  frozenEnemies:[], // enemies currently frozen/slowed
  // Wave tracking
  currentWave:0, waveSpawnQueue:[], waveSpawnTimer:0,
  waveEnemyIndex:0, waveBossDef:null, waveBossSpawned:false,
  waveBossDead:false, waveCleared:false, waveClearTimer:0,
  // Death
  _deathStarted:false, _deathTimer:0, _deathTriggered:false,
  _comboMilestonesHit:{}, comboTimer:0
};

// ============================================================================
// SECTION 2: AUDIO SYSTEM (Web Audio API — procedural sounds)
// ============================================================================
let audioCtx=null, masterGain=null, audioReady=false, isMuted=false;
let shootToggle=false, musicInterval=null;

function initAudio(){if(audioReady)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.3;masterGain.connect(audioCtx.destination);audioReady=true;}catch(e){console.warn('Audio not available:',e);}}

function createNoise(dur){if(!audioReady)return null;const sr=audioCtx.sampleRate,len=Math.floor(sr*dur);const buf=audioCtx.createBuffer(1,len,sr);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return buf;}

function createVoice(type,freq,gainVal,offset){
  if(!audioReady)return null;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type=type;osc.frequency.value=freq;g.gain.value=gainVal||0;
  osc.connect(g);g.connect(masterGain);
  osc.start(audioCtx.currentTime+(offset||0));
  return {osc,g};
}

// SFX Functions
function sfxShoot(){
  if(!audioReady)return;shootToggle=!shootToggle;
  const v=createVoice('square',shootToggle?800:760,0);if(!v)return;
  const t=audioCtx.currentTime,d=0.08;
  v.osc.frequency.setValueAtTime(shootToggle?800:760,t);
  v.osc.frequency.linearRampToValueAtTime((shootToggle?800:760)*0.5,t+d);
  v.g.gain.setValueAtTime(0.001,t);v.g.gain.linearRampToValueAtTime(0.22,t+0.005);
  v.g.gain.exponentialRampToValueAtTime(0.001,t+d);
  v.osc.stop(t+d+0.01);
}

function sfxEnemyShoot(){
  if(!audioReady)return;const v=createVoice('sine',1200,0);if(!v)return;
  const t=audioCtx.currentTime,d=0.06;
  v.osc.frequency.linearRampToValueAtTime(600,t+d);
  v.g.gain.setValueAtTime(0.001,t);v.g.gain.linearRampToValueAtTime(0.12,t+0.003);
  v.g.gain.exponentialRampToValueAtTime(0.001,t+d);v.osc.stop(t+d+0.01);
}

function sfxExplode(size){
  if(!audioReady)return;const dur={small:0.15,medium:0.3,big:0.6}[size]||0.3;
  const buf=createNoise(dur);if(!buf)return;
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain();
  src.buffer=buf;src.connect(g);g.connect(masterGain);
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.start(t);src.stop(t+dur+0.01);
  if(size==='big'){
    const r=createVoice('triangle',80,0);if(r){
      r.g.gain.setValueAtTime(0.25,t+0.01);r.g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      r.osc.frequency.linearRampToValueAtTime(40,t+0.5);r.osc.stop(t+0.55);
    }
  }
}

function sfxPlayerHit(){
  if(!audioReady)return;const t=audioCtx.currentTime;
  const th=createVoice('sine',100,0);if(th){
    th.g.gain.setValueAtTime(0.35,t+0.005);th.g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    th.osc.frequency.linearRampToValueAtTime(50,t+0.1);th.osc.stop(t+0.12);
  }
  const cb=createNoise(0.05);if(cb){
    const cs=audioCtx.createBufferSource(),cg=audioCtx.createGain();

function circlesOverlap(a,b){
  const dx=a.x-b.x,dy=a.y-b.y;
  return dx*dx+dy*dy<((a.radius||8)+(b.radius||8))**2;
}

function checkCollisions(){
  if(GAME.gameState!=='playing')return;
  const player=GAME.player;if(!player||player.invincible===undefined)return;

  // Player bullets vs enemy bullets — cancel each other
  for(let i=0;i<GAME.playerBullets.length;i++){
    const pb=GAME.playerBullets[i];if(!pb.active)continue;
    for(let j=0;j<GAME.enemyBullets.length;j++){
      const eb=GAME.enemyBullets[j];if(!eb.active)continue;
      if(circlesOverlap(pb,eb)){pb.active=false;eb.active=false;
        acquireParticle(pb.x,pb.y,0,0,COLORS.starYellow,4,0.25);break;}
    }
  }

  // Enemy bullets vs player
  if(player.invincible<=0){
    for(let i=0;i<GAME.enemyBullets.length;i++){
      const b=GAME.enemyBullets[i];if(!b.active)continue;
      if(circlesOverlap(player,b)){b.active=false;hitPlayer(1);break;}
    }
  }
  // Player bullets vs enemies
  for(let i=0;i<GAME.playerBullets.length;i++){
    const pb=GAME.playerBullets[i];if(!pb.active)continue;
    for(let j=0;j<GAME.enemies.length;j++){
      const en=GAME.enemies[j];if(!en.active)continue;
      if(circlesOverlap(pb,en)){
        pb.active=false;en.hp-=pb.damage;
        if(en.hp<=0)onEnemyKilled(en);
        else{if(en.type==='boss')spawnHitSparks(en.x,en.y,pb.x,pb.y);}
        break;
      }
    }
  }
  // Player vs enemy body contact
  if(player.invincible<=0){
    for(let i=0;i<GAME.enemies.length;i++){
      const en=GAME.enemies[i];if(!en.active)continue;
      if(circlesOverlap(player,en)){hitPlayer(1);break;}
    }
  }
  // Player vs power-ups
  for(let i=0;i<GAME.powerUps.length;i++){
    const pu=GAME.powerUps[i];if(!pu.active)continue;
    if(circlesOverlap(player,pu)){applyPowerUp(pu);}
  }
}

function hitPlayer(dmg){
  if(GAME.player.invincible>0)return;
  GAME.player.hp-=dmg;GAME.player.invincible=2;GAME.combo=0;
  GAME.screenShake=8;GAME.screenShakeDuration=0.3;GAME.flashAlpha=0.35;
  spawnPlayerHitEffect(GAME.player.x,GAME.player.y);playSound('playerHit');
  // 宇宙大爆发：HP降到5/3/1时触发神龙摆尾+冲击波+寒冰风暴+激光扫射
  if(!GAME._bigBangTriggered)GAME._bigBangTriggered={};
  const bbHp=GAME.player.hp;
  if((bbHp===5||bbHp===3||bbHp===1)&&!GAME._bigBangTriggered[bbHp]){
    GAME._bigBangTriggered[bbHp]=true;
    spawnComboText('宇宙大爆发!',CANVAS_W/2,CANVAS_H/2-30);
    GAME.screenShake=15;GAME.screenShakeDuration=0.6;GAME.flashAlpha=0.8;
    // 激光扫射作为主效果
    triggerAutoEffect('laserSweep');GAME._effectCooldowns.laserSweep=6;
    // 神龙摆尾并行触发
    GAME.effectSweepActive=true;GAME.effectSweepTimer=2.0;
    // 冲击波并行触发
    GAME._burstWave=0;GAME._burstNext=0;GAME.effectBurstActive=true;GAME.effectBurstTimer=1.2;
    // 寒冰风暴（冰冻5秒+减速3秒）
    triggerIceStorm();
    if(audioReady){const t=audioCtx.currentTime;const v=createVoice('sawtooth',30,0);if(v){v.g.gain.setValueAtTime(0.4,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+1.2);v.osc.frequency.linearRampToValueAtTime(120,t+0.6);v.osc.frequency.linearRampToValueAtTime(20,t+1.2);v.osc.stop(t+1.3);}}
  }
  if(GAME.player.hp<=0){GAME.player.hp=0;spawnPlayerDeath();}
}

function spawnPlayerDeath(){
  GAME.player.active=false;GAME._deathStarted=true;GAME._deathTimer=1.2;
  spawnExplosion(GAME.player.x,GAME.player.y,'player');
  GAME.screenShake=12;GAME.screenShakeDuration=1.0;GAME.flashAlpha=0.6;

function onEnemyKilled(enemy){

  spawnExplosion(enemy.x,enemy.y,et);playSound(et==='tank'?'bigExplode':(et==='fast'||et==='swarmer'?'smallExplode':'explode'));

      const se=acquireEnemy(sx,sy,'swarmer');if(!se)continue;
      const td=ENEMY_TYPES.swarmer;se.hp=td.hp;se.maxHp=td.hp;se.speed=td.speed+Math.random()*50;se.scoreValue=td.score;se.w=se.h=td.size;se.radius=td.size/2;se.canShoot=false;se.shootInterval=0;

// ============================================================================
// SECTION 6: GAME LOOP & UPDATE
// ============================================================================
const FIXED_DT=1/60;let _lastTime=0,_accum=0,_rafId=null;

function initGameLoop(){_lastTime=performance.now();_accum=0;_rafId=requestAnimationFrame(loop);}

function loop(ts){
  _rafId=requestAnimationFrame(loop);
  let raw=(ts-_lastTime)/1000;_lastTime=ts;
  if(raw>0.25)raw=0.25;
  const scaled=raw*(GAME.slowMotion||1);_accum+=scaled;
  let steps=0;const maxSteps=Math.ceil(0.25/FIXED_DT);
  while(_accum>=FIXED_DT&&steps<maxSteps){update(FIXED_DT);_accum-=FIXED_DT;steps++;}
  if(steps>=maxSteps)_accum=0;
  GAME.dt=scaled;render();
}

function update(dt){
  GAME.time+=dt;
  // Pause toggle
  if(isDown('KeyP')||isDown('Escape')){if(!pauseToggle){pauseToggle=true;togglePause();}}else pauseToggle=false;
  if(GAME.gameState!=='playing')return;
  GAME.waveTimer+=dt;
  updatePlayer(dt);updateEnemies(dt);updateBullets(dt);updateParticles(dt);
  updatePowerUps(dt);updateComboTexts(dt);updateEffects(dt);
  updateWaveSpawning(dt);updateSlowMotion(dt);updateComboTimer(dt);
  updateAmbientSpawns(dt);updateAutoEffects(dt);
  if(GAME.effectBurstActive){GAME.effectBurstTimer-=dt;updateBurst(dt);if(GAME.effectBurstTimer<=0)GAME.effectBurstActive=false;}
  if(GAME.effectSweepActive){GAME.effectSweepTimer-=dt;updateSweep(dt);if(GAME.effectSweepTimer<=0)GAME.effectSweepActive=false;}
  checkPlayerDeath(dt);checkCollisions();
}

function updatePlayer(dt){
  const p=GAME.player;if(!p||!p.active)return;
  // Mobile joystick or mouse-follow movement
  let mx=0,my=0;
  if((GAME.mobileDX||GAME.mobileDY)&&(GAME.mobileDX!==0||GAME.mobileDY!==0)){
    mx=GAME.mobileDX;my=GAME.mobileDY;
    let spd=(p.speed||550)*(p._speedBoost||1)*dt;
    p.x+=mx*spd;p.y+=my*spd;
  }else if(GAME.mouseOnCanvas){
    const dx=GAME.mouseX-p.x,dy=GAME.mouseY-p.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>2){mx=dx/dist;my=dy/dist;}
    let spd=Math.min(dist*14,750)*(p._speedBoost||1)*dt;
    if(spd>dist)spd=dist;
    p.x+=mx*spd;p.y+=my*spd;
  }else{
    // Keyboard fallback
    if(isDown('ArrowLeft')||isDown('KeyA'))mx=-1;
    if(isDown('ArrowRight')||isDown('KeyD'))mx=1;
    if(isDown('ArrowUp')||isDown('KeyW'))my=-1;
    if(isDown('ArrowDown')||isDown('KeyS'))my=1;
    if(mx!==0&&my!==0){const m=Math.sqrt(mx*mx+my*my);mx/=m;my/=m;}
    let spd=(p.speed||550)*(p._speedBoost||1);
    p.x+=mx*spd*dt;p.y+=my*spd*dt;
  }
  // Clamp to bounds
  p.x=Math.max(p.w/2,Math.min(CANVAS_W-p.w/2,p.x));
  p.y=Math.max(p.h/2,Math.min(CANVAS_H-p.h/2,p.y));
  // Auto-fire always on during gameplay
  if(p.shootCooldown>0)p.shootCooldown-=dt;
  if(p.shootCooldown<=0){
    p.shootCooldown=0.1;firePlayerBullets(p);
  }
  // Timers
  if(p._spreadTimer>0){p._spreadTimer-=dt;if(p._spreadTimer<=0){p._spreadTimer=0;p.powerLevel=1;}}
  if(p._speedTimer>0){p._speedTimer-=dt;if(p._speedTimer<=0){p._speedTimer=0;p._speedBoost=1;}}
  if(p._shieldTimer>0){p._shieldTimer-=dt;if(p._shieldTimer<=0){p._shieldTimer=0;}}
  if(p.invincible>0){p.invincible-=dt;if(p.invincible<0)p.invincible=0;}
}

function firePlayerBullets(p){
  const spd=-600,pool=GAME.playerBullets,lv=p.powerLevel||1,cx=p.x,cy=p.y-16;
  const dmg=1+(GAME.upgradeLevel||0); // Base damage + upgrade bonus
  playSound('shoot');
  if(lv>=3){acquireBullet(pool,cx-10,cy,0,spd,dmg);acquireBullet(pool,cx,cy,0,spd,dmg);acquireBullet(pool,cx+10,cy,0,spd,dmg);}
  if(lv>=4){acquireBullet(pool,cx-20,cy+8,-80,spd*0.95,dmg);acquireBullet(pool,cx+20,cy+8,80,spd*0.95,dmg);}
  if(lv>=5){acquireBullet(pool,cx-26,cy+14,-150,spd*0.85,dmg);acquireBullet(pool,cx+26,cy+14,150,spd*0.85,dmg);}
  if(lv===2){acquireBullet(pool,cx-6,cy,0,spd,dmg);acquireBullet(pool,cx+6,cy,0,spd,dmg);}
  else if(lv===1)acquireBullet(pool,cx,cy,0,spd,dmg);
}

function updateEnemies(dt){
  for(let i=0;i<GAME.enemies.length;i++){
    const e=GAME.enemies[i];if(!e.active)continue;
    if(e.type==='boss')updateBoss(e,dt);
    else{updateEnemyPattern(e,dt);updateEnemyShooting(e,dt);}
    if(e.y>CANVAS_H+60||e.y<-60||e.x<-60||e.x>CANVAS_W+60){e.active=false;if(e.y>CANVAS_H+10)GAME.combo=0;}
  }
}

function updateBullets(dt){
  for(let i=0;i<GAME.playerBullets.length;i++){const b=GAME.playerBullets[i];if(!b.active)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20||b.y>CANVAS_H+20||b.x<-20||b.x>CANVAS_W+20)b.active=false;}
  for(let i=0;i<GAME.enemyBullets.length;i++){
    const b=GAME.enemyBullets[i];if(!b.active)continue;
    // Homing: track player
    if(b._homing&&GAME.player&&GAME.player.active){
      b._homingLife-=dt;if(b._homingLife<=0)b._homing=false;
      const dx=GAME.player.x-b.x,dy=GAME.player.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      b.vx+=(dx/d*speed-b.vx)*3*dt;b.vy+=(dy/d*speed-b.vy)*3*dt;
    }
    // Expanding bullets (burst pattern)
    if(b._expanding){b._expandSpd=(b._expandSpd||200)+100*dt;const a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*b._expandSpd;b.vy=Math.sin(a)*b._expandSpd;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-50||b.y>CANVAS_H+50||b.x<-50||b.x>CANVAS_W+50)b.active=false;
  }
}

function updateParticles(dt){
  for(let i=0;i<GAME.particles.length;i++){
    const p=GAME.particles[i];if(!p.active)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rotation+=p.rotationSpeed*dt;p.life-=dt;
    if(p.life<=0){p.active=false;}
    else{p.alpha=Math.max(0,p.life/p.maxLife);}
  }
}

function updatePowerUps(dt){
  for(let i=0;i<GAME.powerUps.length;i++){
    const pu=GAME.powerUps[i];if(!pu.active)continue;
    pu.wobbleTimer+=dt;pu.y+=pu.vy*dt;pu.x+=Math.sin(pu.wobbleTimer*3)*15*dt;
    if(pu.y>CANVAS_H+50)pu.active=false;
  }
}

function updateComboTexts(dt){
  for(let i=GAME.comboTexts.length-1;i>=0;i--){
    const ct=GAME.comboTexts[i];ct.y-=60*dt;ct.life-=dt;if(ct.life<=0)GAME.comboTexts.splice(i,1);
  }
}

function updateEffects(dt){
  if(GAME.screenShakeDuration>0){GAME.screenShakeDuration-=dt;if(GAME.screenShakeDuration<=0){GAME.screenShake=0;GAME.screenShakeDuration=0;}}
  if(GAME.flashAlpha>0){GAME.flashAlpha-=dt*2;if(GAME.flashAlpha<0)GAME.flashAlpha=0;}
}

function updateSlowMotion(dt){
  if(GAME.slowMotionTimer>0){GAME.slowMotionTimer-=dt;if(GAME.slowMotionTimer<=0){GAME.slowMotionTimer=0;GAME.slowMotion=1;}}
}

function updateEnemyPattern(enemy,dt){
  if(enemy._frozen)return; // Frozen: no movement
  const pd=enemy.patternData;pd.patternTimer=(pd.patternTimer||0)+dt;
  if(pd.startX===undefined){pd.startX=enemy.x;pd.startY=enemy.y;}
  const t=pd.patternTimer,sx=pd.startX,sy=pd.startY,spd=enemy.speed||100;
  switch(enemy.pattern){
    case'straight':enemy.y+=spd*dt;break;
    case'sine':enemy.y+=spd*dt;enemy.x=sx+Math.sin(t*3)*60;break;
    case'zigzag':
      if(pd.zigT===undefined){pd.zigT=0;pd.vx=80;}pd.zigT+=dt;
      if(pd.zigT>=1.2){pd.zigT-=1.2;pd.vx=-pd.vx;}enemy.x+=pd.vx*dt;enemy.y+=120*dt;break;
    case'circle':
      if(pd.circT===undefined){pd.circT=0;pd.cx=sx;pd.cy=sy+80;}pd.circT+=dt;
      if(pd.circT<2.5){const a=pd.circT*2*Math.PI*0.7;enemy.x=pd.cx+Math.cos(a)*50;enemy.y=pd.cy+Math.sin(a)*50;}
      else enemy.y+=(spd+80)*dt;break;
    case'hover':
      if(pd.hovTarget===undefined){pd.hovTarget=Math.max(80,Math.min(CANVAS_H*0.35,sy+100));pd.hovDir=1;}
      if(enemy.y<pd.hovTarget){enemy.y+=spd*dt;if(enemy.y>pd.hovTarget)enemy.y=pd.hovTarget;}
      else{pd.hovSideT=(pd.hovSideT||0)+dt;enemy.x+=pd.hovDir*40*dt;if(pd.hovSideT>1.8){pd.hovSideT=0;pd.hovDir=-pd.hovDir;}if(enemy.x<50){enemy.x=50;pd.hovDir=1;}if(enemy.x>CANVAS_W-50){enemy.x=CANVAS_W-50;pd.hovDir=-1;}}break;
    case'charge':if(t<1.5)enemy.y+=20*dt;else enemy.y+=300*dt;break;
    default:enemy.y+=spd*dt;break;
  }
}

function updateEnemyShooting(enemy,dt){
  if(!enemy.canShoot||GAME.gameState!=='playing')return;enemy._shootTimer=(enemy._shootTimer||0)+dt;
  if(enemy._shootTimer<enemy.shootInterval)return;enemy._shootTimer=0;
  const p=GAME.player;if(!p||p.hp<=0)return;
  const dx=p.x-enemy.x,dy=p.y-enemy.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
  acquireBullet(GAME.enemyBullets,enemy.x,enemy.y+16,dx/dist*220,dy/dist*220,1);
  playSound('enemyShoot');
}

function startWave(num){
  let idx=num-1;if(idx>=WAVE_DEFS.length)idx=WAVE_DEFS.length-1;
  const wd=WAVE_DEFS[idx];
  const loopCount=Math.max(1,Math.floor(num/WAVE_DEFS.length)+1);
  GAME.currentWave=num;GAME.waveTimer=0;GAME.waveSpawnTimer=0.15;GAME.waveEnemyIndex=0;
  GAME.waveBossDef=wd.boss?{hp:wd.boss.hp*loopCount,score:wd.boss.score*loopCount}:null;
  GAME.waveBossSpawned=false;GAME.waveBossDead=false;
  GAME.waveCleared=false;GAME.waveClearTimer=0;GAME.bossWarning=0;GAME._waveEndTimer=0;
  GAME.wave=num;
  // Build spawn queue: halved delays, scaled counts
  let q=[];wd.enemies.forEach(g=>{const c=Math.floor(g.count*(0.8+loopCount*0.4));for(let e=0;e<c;e++)q.push({type:g.type,pattern:g.pattern,delay:Math.max(0.015,g.delay*0.25-loopCount*0.02)});});
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  GAME.waveSpawnQueue=q;
  if(typeof spawnComboText==='function')spawnComboText('第 '+num+' 波',CANVAS_W/2,400);
}

function updateWaveSpawning(dt){
  if(GAME.gameState!=='playing')return;
  if(GAME.bossWarning>0&&!GAME.waveBossSpawned){GAME.bossWarningTimer-=dt;if(GAME.bossWarningTimer<=0){spawnBoss(GAME.currentWave);GAME.waveBossSpawned=true;GAME.bossWarning=0;}return;}
  if(GAME.waveCleared){GAME.waveClearTimer+=dt;if(GAME.waveClearTimer>=0.3)startWave(GAME.currentWave+1);return;}
  const q=GAME.waveSpawnQueue;
  const warmup=Math.min(1,GAME.waveTimer/10);
  const waveSpeed=1+GAME.wave*0.5;
  if(GAME.waveEnemyIndex<q.length){GAME.waveSpawnTimer+=dt*warmup*waveSpeed;const e=q[GAME.waveEnemyIndex];if(GAME.waveSpawnTimer>=e.delay){GAME.waveSpawnTimer=0;spawnWaveEnemy(e);GAME.waveEnemyIndex++;}}
  // Wave completion
  if(GAME.waveEnemyIndex>=q.length){
    if(GAME.waveBossDef&&!GAME.waveBossSpawned){
      // Boss wave: wait until no non-boss enemies alive, then trigger boss warning
      let nonBossAlive=false;for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(e.active&&e.type!=='boss'){nonBossAlive=true;break;}}
      if(!nonBossAlive&&GAME.bossWarning<=0){GAME.bossWarning=2;GAME.bossWarningTimer=2;playSound('bossWarning');}
    }else if(GAME.waveBossDead){
      // Boss killed: wave cleared
      GAME.waveCleared=true;GAME.waveClearTimer=0;
    }else if(!GAME.waveBossDef){
      // No boss: auto-complete 3s after all queued enemies spawned
      GAME._waveEndTimer=(GAME._waveEndTimer||0)+dt;
      if(GAME._waveEndTimer>=3.0){GAME.waveCleared=true;GAME.waveClearTimer=0;GAME._waveEndTimer=0;}
    }
  }
}

function spawnWaveEnemy(entry){
  const x=40+Math.random()*(CANVAS_W-80);
  const e=acquireEnemy(x,-30,entry.type);if(!e)return;
  const td=ENEMY_TYPES[entry.type];const scale=1+(GAME.wave-1)*0.2; // HP +20% per wave
  if(td){e.hp=Math.ceil(td.hp*scale);e.maxHp=e.hp;e.speed=td.speed;e.scoreValue=Math.ceil(td.score*scale);e.w=e.h=td.size;e.radius=td.size/2;e.canShoot=td.canShoot;e.shootInterval=td.shootInterval;}
  e.pattern=entry.pattern;e.patternData={patternTimer:0,startX:x,startY:-30};e._shootTimer=Math.random()*e.shootInterval;
}

function spawnBoss(num){
  const e=acquireEnemy(CANVAS_W/2,-60,'boss');if(!e)return;
  const def=GAME.waveBossDef||{hp:200,score:5000};
  e.hp=def.hp*2;e.maxHp=e.hp;e.w=120;e.h=84;e.radius=50;e.speed=50;
  e.scoreValue=def.score;e.pattern='boss';e.canShoot=true;e.shootInterval=2.0;
  e.patternData={phase:1,moveDir:1,entered:false,_phaseMoveT:0,_sideT:0};e._shootTimer=0;e._patternChangeTimer=0;e._currentPattern='aimed';
  GAME.waveBossSpawned=true;GAME.waveBossDead=false;
}

function updateBoss(boss,dt){
  if(!boss||!boss.active)return;const pd=boss.patternData;
  pd.patternTimer=(pd.patternTimer||0)+dt;
  // Entry
  if(!pd.entered){boss.y+=50*dt;if(boss.y>=100){boss.y=100;pd.entered=true;GAME.bossActive=true;}return;}
  const hpPct=boss.hp/boss.maxHp;
  let phase=hpPct>0.7?1:(hpPct>0.4?2:3);
  if(phase!==pd.phase){pd.phase=phase;pd._phaseMoveT=0;}
  pd._phaseMoveT=(pd._phaseMoveT||0)+dt;
  // Movement
  switch(phase){
    case 1:boss.y=100;boss.x+=pd.moveDir*30*dt;pd._sideT=(pd._sideT||0)+dt;if(pd._sideT>2){pd._sideT=0;pd.moveDir=-pd.moveDir;}if(boss.x<80){boss.x=80;pd.moveDir=1;}if(boss.x>CANVAS_W-80){boss.x=CANVAS_W-80;pd.moveDir=-1;}break;
    case 2:boss.y=100+Math.sin(pd._phaseMoveT*1.5)*20;boss.x+=pd.moveDir*80*dt;if(boss.x<80||boss.x>CANVAS_W-80)pd.moveDir=-pd.moveDir;break;
    case 3:boss.y=100+Math.sin(pd._phaseMoveT*2.5)*40;boss.x+=pd.moveDir*120*dt;if(boss.x<60||boss.x>CANVAS_W-60)pd.moveDir=-pd.moveDir;break;
  }
  // Pattern change every 3 seconds
  boss._patternChangeTimer=(boss._patternChangeTimer||0)-dt;
  if(boss._patternChangeTimer<=0){
    boss._patternChangeTimer=3;
    const patterns=phase===1?['aimed','spread','double']:phase===2?['aimed','spread','ring','homing','double','wave']:['spread','ring','homing','homing','wave','double','spiral','burst'];
    boss._currentPattern=patterns[Math.floor(Math.random()*patterns.length)];
  }
  // Shooting
  boss._shootTimer=(boss._shootTimer||0)+dt;
  const iv=[0,2.0,2.0,2.0][phase];
  if(boss._shootTimer>=iv){boss._shootTimer=0;bossShoot(boss,phase);}
}

function bossShoot(boss,phase){
  const p=GAME.player;if(!p||p.hp<=0)return;
  const bx=boss.x,by=boss.y,dx=p.x-bx,dy=p.y-by,dist=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=180+phase*30;
  const pat=boss._currentPattern||'aimed';
  const mkBoss=function(x,y,vx,vy,dmg){const b=acquireBullet(GAME.enemyBullets,x,y,vx,vy,dmg||1);if(b){b._bossBullet=true;b.radius=6;b.w=b.h=12;}return b;};
  switch(pat){
    case'aimed':mkBoss(bx,by,dx/dist*spd,dy/dist*spd);break;
    case'spread':for(let a=-2;a<=2;a++){const ang=Math.atan2(dy,dx)+a*0.2;mkBoss(bx,by,Math.cos(ang)*spd,Math.sin(ang)*spd);}break;
    case'double':for(let a=-1;a<=1;a+=2){const ang=Math.atan2(dy,dx)+a*0.4;mkBoss(bx,by,Math.cos(ang)*spd,Math.sin(ang)*spd);}break;
    case'ring':for(let i=0;i<16;i++){const a=i/16*Math.PI*2;mkBoss(bx,by,Math.cos(a)*140,Math.sin(a)*140);}break;
    case'homing':for(let i=0;i<4;i++){const a=Math.atan2(dy,dx)+(i-1.5)*0.25;const b=mkBoss(bx,by,Math.cos(a)*60,Math.sin(a)*60);if(b){b._homing=true;b._homingLife=3.0;}}break;
    case'wave':for(let i=0;i<10;i++){const a=-Math.PI/2+(i-4.5)*0.15;mkBoss(bx,by,Math.cos(a)*spd,Math.sin(a)*spd);}break;
    case'spiral':for(let i=0;i<20;i++){const a=i/20*Math.PI*2+GAME.time*3;mkBoss(bx,by,Math.cos(a)*(100+i*5),Math.sin(a)*(100+i*5));}break;
    case'burst':for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const b=mkBoss(bx,by,Math.cos(a)*80,Math.sin(a)*80);if(b){b._expanding=true;b._expandSpd=200;}}break;
  }
  playSound('enemyShoot');
}

function onBossDeath(boss){
  spawnBossExplosion(boss.x,boss.y);playSound('bossDeath');
  GAME.bossActive=false;
  for(let i=0;i<GAME.enemies.length;i++){if(GAME.enemies[i].active&&GAME.enemies[i].type!=='boss')GAME.enemies[i].active=false;}
  for(let i=0;i<GAME.enemyBullets.length;i++)GAME.enemyBullets[i].active=false; // Clear all enemy bullets
  GAME.slowMotion=0.3;GAME.slowMotionTimer=1.5;
  if(GAME.player)GAME.player.invincible=5; // 宇宙大爆炸触发时5秒无敌
  for(let i=0;i<2;i++){const types=['spread','spread','spread','speed'];acquirePowerUp(boss.x-40+Math.random()*80,boss.y-10+Math.random()*40,types[Math.floor(Math.random()*types.length)]);}
  GAME.waveBossDead=true;
}

// ================================================================
// AUTO-TRIGGER SPECIAL EFFECTS (间隔触发: 闪电链/神龙摆尾/冲击波/流星雨/散射/侧方射击/冲击波)
// ================================================================
const AUTO_EFFECTS=['sweep','burst','meteor','scatter','sideShot','iceStorm','laserSweep'];
function updateAutoEffects(dt){
  if(GAME.bossWarning>0)return;
  // Decay per-effect cooldowns
  const cd=GAME._effectCooldowns;
  for(const k in cd)if(cd[k]>0)cd[k]-=dt;
  // Lightning fires independently when ready (up to 3 concurrent chains)
  const maxChains=GAME.wave>=10?3:(GAME.wave>=5?2:1);
  if((cd.lightning||0)<=0&&GAME.lightningChains.length<maxChains){
    GAME.lightningChains.push({timer:3.6,enemies:[]});
    GAME.effectDisplayName=GAME.effectDisplayName||'闪电链';
    cd.lightning=GAME._lightningBaseCooldown;
    GAME._lightningBaseCooldown=Math.max(0.1,GAME._lightningBaseCooldown*0.9);
  }
  // Other skills fire when no non-lightning effect is active
  if(!GAME.activeEffect){
    const others=AUTO_EFFECTS.filter(e=>(cd[e]||0)<=0);
    if(others.length>0){
      const eff=others[Math.floor(Math.random()*others.length)];
      triggerAutoEffect(eff);
      cd[eff]=eff==='iceStorm'?8:6+Math.random()*2;
    }
  }
  // Lightning runs independently (multiple concurrent chains)
  // Collect enemies already claimed by other chains to avoid overlap
  const claimedEnemies=new Set();
  for(let i=0;i<GAME.lightningChains.length;i++){
    const lc=GAME.lightningChains[i];
    for(let j=1;j<lc.enemies.length;j++){if(lc.enemies[j]&&lc.enemies[j].active)claimedEnemies.add(lc.enemies[j]);}
  }
  for(let i=GAME.lightningChains.length-1;i>=0;i--){
    const lc=GAME.lightningChains[i];lc.timer-=dt;
    if(lc.timer<=0){GAME.lightningChains.splice(i,1);continue;}
    // Remove this chain's own enemies from the claimed set so it can keep them
    for(let j=1;j<lc.enemies.length;j++){if(lc.enemies[j])claimedEnemies.delete(lc.enemies[j]);}
    updateLightningChain(lc,dt,claimedEnemies);
    // Re-add this chain's enemies to claimed set
    for(let j=1;j<lc.enemies.length;j++){if(lc.enemies[j]&&lc.enemies[j].active)claimedEnemies.add(lc.enemies[j]);}
  }
  // Other effects
  if(GAME.activeEffect){
    GAME.effectTimer-=dt;
    switch(GAME.activeEffect){
      case'sweep':updateSweep(dt);break;
      case'burst':updateBurst(dt);break;
      case'meteor':updateMeteors(dt);break;
      case'scatter':updateScatter(dt);break;
      case'sideShot':updateSideShot(dt);break;
      case'iceStorm':updateIceStorm(dt);break;
      case'laserSweep':updateLaserSweep(dt);break;
    }
    if(GAME.effectTimer<=0){GAME.activeEffect=null;GAME.effectDisplayName='';GAME.effectMeteors=[];}
  }
}

function triggerAutoEffect(eff){
  GAME.activeEffect=eff;
  let name='';
  switch(eff){
    case'sweep':GAME.effectTimer=2.0;name='神龙摆尾';break;
    case'burst':GAME.effectTimer=1.2;GAME._burstWave=0;GAME._burstNext=0;name='冲击波';break;
    case'meteor':GAME.effectTimer=4.0;GAME.effectMeteors=[];name='流星雨';break;
    case'scatter':GAME.effectTimer=3.0;name='散射弹幕';break;
    case'sideShot':GAME.effectTimer=3.0;name='侧方射击';break;
    case'iceStorm':GAME.effectTimer=2.0;name='寒冰风暴';triggerIceStorm();break;
    case'laserSweep':GAME.effectTimer=3.0;name='激光扫射';break;
  }
  GAME.effectDisplayName=name;
  spawnComboText(name,CANVAS_W/2,CANVAS_H/2-60);
  if(eff==='laserSweep'){sfxLaserSweep();}
  else if(audioReady){const t=audioCtx.currentTime;const f=eff==='bomb'?60:(eff==='burst'?600:400);const v=createVoice('triangle',f,0);if(v){v.g.gain.setValueAtTime(0.15,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.3);v.osc.stop(t+0.35);}}
}

// 闪电链 — per-chain update, claimedEnemies excludes enemies already in other chains
function updateLightningChain(lc,dt,claimedEnemies){
  const p=GAME.player;if(!p||!p.active)return;
  const enemies=GAME.enemies.filter(e=>e.active&&!claimedEnemies.has(e));if(enemies.length<1){lc.enemies=[p];return;}
  const chain=[p];let curr=p;
  for(let step=0;step<12;step++){
    let nearest=null,minD=350;
    for(let i=0;i<enemies.length;i++){if(chain.includes(enemies[i]))continue;const d=Math.sqrt((enemies[i].x-curr.x)**2+(enemies[i].y-curr.y)**2);if(d<minD){minD=d;nearest=enemies[i];}}
    if(!nearest)break;chain.push(nearest);curr=nearest;
  }
  lc.enemies=chain;
  for(let i=1;i<chain.length;i++){chain[i].hp-=4*dt;spawnHitSparks(chain[i].x,chain[i].y,chain[i].x,chain[i].y);if(chain[i].hp<=0)onEnemyKilled(chain[i]);}
  for(let i=0;i<GAME.enemyBullets.length;i++){const b=GAME.enemyBullets[i];if(!b.active)continue;
    for(let j=1;j<chain.length;j++){if(Math.sqrt((b.x-chain[j].x)**2+(b.y-chain[j].y)**2)<60){b.active=false;acquireParticle(b.x,b.y,0,0,COLORS.starYellow,3,0.2);break;}}
  }
}

// 寒冰风暴 — freeze all non-boss enemies 5s, then slow 3s
function triggerIceStorm(){
  for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(!e.active||e.type==='boss')continue;e._frozen=true;e._frozenTimer=5.0;e._savedVx=e.vx;e._savedVy=e.vy;e.vx=0;e.vy=0;}
  for(let i=0;i<GAME.enemyBullets.length;i++){const b=GAME.enemyBullets[i];if(b.active){b.vx*=0.3;b.vy*=0.3;}} // Slow bullets too
  GAME.screenShake=3;GAME.screenShakeDuration=0.3;
  if(audioReady){const t=audioCtx.currentTime;const v=createVoice('sine',200,0);if(v){v.g.gain.setValueAtTime(0.2,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.5);v.osc.frequency.linearRampToValueAtTime(80,t+0.5);v.osc.stop(t+0.55);}}
}
function updateIceStorm(dt){
  for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(!e.active||e.type==='boss'||!e._frozen)continue;
    e._frozenTimer-=dt;
    if(e._frozenTimer<=0){e._frozen=false;e.vx=e._savedVx*0.4;e.vy=e._savedVy*0.4;e._slowed=true;e._slowTimer=3.0;} // Thaw + slow
  }
  // Handle slowed enemies
  for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(!e.active||!e._slowed)continue;
    e._slowTimer-=dt;if(e._slowTimer<=0){e._slowed=false;e.vx=e._savedVx;e.vy=e._savedVy;}
  }
}

// 神龙摆尾 — sweeping beam bullets from player
function updateSweep(dt){
  const p=GAME.player;if(!p||!p.active)return;
  const t=GAME.effectSweepActive?GAME.effectSweepTimer:(GAME.effectTimer||0);
  const angle=Math.sin(t*8)*Math.PI*0.6-Math.PI/2;
  for(let i=0;i<7;i++){
    const a=angle-Math.PI*0.25+i*Math.PI*0.083;
    acquireBullet(GAME.playerBullets,p.x,p.y+10,Math.cos(a)*500,Math.sin(a)*500,2);
  }
}

// 冲击波 — 5 waves of 360° bullets
function updateBurst(dt){
  const p=GAME.player;if(!p||!p.active)return;
  GAME._burstNext=(GAME._burstNext||0)-dt;
  if(GAME._burstNext<=0&&(GAME._burstWave||0)<5){
    GAME._burstWave=(GAME._burstWave||0)+1;
    GAME._burstNext=0.2;
    const count=36+GAME._burstWave*10;
    for(let i=0;i<count;i++){const a=i/count*Math.PI*2+GAME._burstWave*0.25;acquireBullet(GAME.playerBullets,p.x,p.y,Math.cos(a)*(300+GAME._burstWave*80),Math.sin(a)*(300+GAME._burstWave*80),1);}
    GAME.screenShake=2+GAME._burstWave;GAME.screenShakeDuration=0.12;
    if(audioReady){const t=audioCtx.currentTime;const v=createVoice('triangle',400+GAME._burstWave*150,0);if(v){v.g.gain.setValueAtTime(0.12,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.15);v.osc.stop(t+0.2);}}
  }
}

// 流星雨 — fireballs shoot upward from player
function updateMeteors(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*40&&GAME.effectMeteors.length<50){
    const a=-Math.PI/2+(Math.random()-0.5)*1.0; // upward spread
    GAME.effectMeteors.push({x:p.x,y:p.y-10,vx:Math.cos(a)*(300+Math.random()*400),vy:Math.sin(a)*(300+Math.random()*400),life:1.5});
  }
  for(let i=GAME.effectMeteors.length-1;i>=0;i--){
    const m=GAME.effectMeteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;
    if(m.y<-50||m.y>CANVAS_H+50||m.x<-50||m.x>CANVAS_W+50||m.life<=0){GAME.effectMeteors.splice(i,1);continue;}
    for(let j=0;j<GAME.enemies.length;j++){const en=GAME.enemies[j];if(!en.active)continue;if(Math.sqrt((en.x-m.x)**2+(en.y-m.y)**2)<35){en.hp-=8;if(en.hp<=0)onEnemyKilled(en);m.life=0;break;}}
    if(Math.random()<0.5)acquireParticle(m.x,m.y,-m.vx*0.05,-m.vy*0.05,COLORS.coral,2+Math.random()*3,0.25);
  }
}

// 散射弹幕 — wide cone burst, fires rapidly for duration
function updateScatter(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*12){ // rapid fire
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(Math.random()-0.5)*1.2; // wide upward cone
      acquireBullet(GAME.playerBullets,p.x,p.y-10,Math.cos(a)*450,Math.sin(a)*450,1);
    }
  }
}

// 侧方射击 — bullets fire left and right simultaneously
function updateSideShot(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*10){
    // Left side
    for(let i=-2;i<=2;i++){acquireBullet(GAME.playerBullets,p.x-16,p.y+i*8,-500,Math.sin(i*0.3)*80,1);}
    // Right side
    for(let i=-2;i<=2;i++){acquireBullet(GAME.playerBullets,p.x+16,p.y+i*8,500,Math.sin(i*0.3)*80,1);}
    // Up
    acquireBullet(GAME.playerBullets,p.x,p.y-16,0,-550,1);
  }
}

// 激光扫射 — two beams start from left, rotate opposite directions
function beamDamage(sweepAngle,dt){
  const p=GAME.player;if(!p||!p.active)return;
  const beamLen=Math.sqrt(CANVAS_W*CANVAS_W+CANVAS_H*CANVAS_H);
  const ex=p.x+Math.sin(sweepAngle)*beamLen,ey=p.y-Math.cos(sweepAngle)*beamLen;
  const ax=p.x,ay=p.y,bx=ex,by=ey;
  const abx=bx-ax,aby=by-ay,abLen2=abx*abx+aby*aby;
  // Damage enemies (penetrating)
  for(let i=0;i<GAME.enemies.length;i++){
    const en=GAME.enemies[i];if(!en.active)continue;
    let t=((en.x-ax)*abx+(en.y-ay)*aby)/abLen2;
    t=Math.max(0,Math.min(1,t));
    const cx=ax+t*abx,cy=ay+t*aby;
    const dist=Math.sqrt((en.x-cx)**2+(en.y-cy)**2);
    if(dist<en.radius+8){en.hp-=5*dt;spawnHitSparks(en.x,en.y,cx,cy);if(en.hp<=0)onEnemyKilled(en);}
  }
  // Destroy enemy bullets along beam
  for(let i=0;i<GAME.enemyBullets.length;i++){
    const b=GAME.enemyBullets[i];if(!b.active)continue;
    let t=((b.x-ax)*abx+(b.y-ay)*aby)/abLen2;
    t=Math.max(0,Math.min(1,t));
    if(Math.sqrt((b.x-(ax+t*abx))**2+(b.y-(ay+t*aby))**2)<12){b.active=false;acquireParticle(b.x,b.y,0,0,COLORS.starYellow,3,0.2);}
  }
}
function updateLaserSweep(dt){
  const p=GAME.player;if(!p||!p.active)return;
  const progress=1-(GAME.effectTimer/3.0); // 0→1 over 3s
  const angle1=-Math.PI/2+progress*2*Math.PI; // CW: left→top→right→bottom→left
  const angle2=-Math.PI/2-progress*2*Math.PI; // CCW: left→bottom→right→top→left
  GAME._laserSweepAngle1=angle1;GAME._laserSweepAngle2=angle2;
  beamDamage(angle1,dt);beamDamage(angle2,dt);
}

// Ambient enemy spawns between waves for roguelike non-stop action
let _ambientTimer=0;
function updateAmbientSpawns(dt){
  if(GAME.waveCleared||GAME.bossWarning>0||GAME.waveBossDead)return;
  if(GAME.waveBossDef&&!GAME.waveBossSpawned&&GAME.waveEnemyIndex>=GAME.waveSpawnQueue.length)return;
  _ambientTimer+=dt;
  // Ramp-up: slower first 10s, then ramps up
  const warmup=Math.min(1,GAME.waveTimer/10); // 0→1 over 10 seconds
  const baseInterval=0.5*Math.pow(0.7,GAME.wave-1)+0.03; // Fast early, gradual late
  const interval=baseInterval/(0.15+warmup*0.85);
  if(_ambientTimer>=interval){
    _ambientTimer=0;
    const types=['basic','basic','fast','fast','swarmer','swarmer','tank'];
    if(GAME.wave>=2)types.push('swarmer','swarmer','swarmer');
    if(GAME.wave>=3)types.push('splitter','splitter');
    if(GAME.wave>=5)types.push('tank','tank','splitter');
    if(GAME.wave>=8)types.push('tank','tank','splitter','splitter','swarmer','swarmer');
    if(GAME.wave>=12)types.push('tank','tank','tank','splitter','splitter','splitter');
    const t=types[Math.floor(Math.random()*types.length)];
    const x=40+Math.random()*(CANVAS_W-80);
    const patterns=['straight','sine','zigzag','charge','circle'];
    const e=acquireEnemy(x,-30,t);if(!e)return;
    const td=ENEMY_TYPES[t];const sc=1+(GAME.wave-1)*0.2;if(td){e.hp=Math.ceil(td.hp*sc);e.maxHp=e.hp;e.speed=td.speed;e.scoreValue=Math.ceil(td.score*sc);e.w=e.h=td.size;e.radius=td.size/2;e.canShoot=td.canShoot;e.shootInterval=td.shootInterval;}
    e.pattern=patterns[Math.floor(Math.random()*patterns.length)];
    e.patternData={patternTimer:0,startX:x,startY:-30};e._shootTimer=Math.random()*e.shootInterval;
    const groupChance=Math.min(0.95,Math.max(0.5,(0.2+warmup*0.4)+GAME.wave*0.05));
    if(Math.random()<groupChance){
      const groupSize=warmup<0.5?1:Math.min(7,2+Math.floor(GAME.wave/3));
      for(let s=0;s<groupSize;s++){
        const sx=40+Math.random()*(CANVAS_W-80);const st=types[Math.floor(Math.random()*types.length)];
        const se=acquireEnemy(sx,-30-Math.random()*40,st);if(!se)continue;
        const sd=ENEMY_TYPES[st];const scl=1+(GAME.wave-1)*0.2;if(sd){se.hp=Math.ceil(sd.hp*scl);se.maxHp=se.hp;se.speed=sd.speed;se.scoreValue=Math.ceil(sd.score*scl);se.w=se.h=sd.size;se.radius=sd.size/2;se.canShoot=sd.canShoot;se.shootInterval=sd.shootInterval;}
        se.pattern=patterns[Math.floor(Math.random()*patterns.length)];se.patternData={patternTimer:0,startX:sx,startY:-30};se._shootTimer=Math.random()*se.shootInterval;
      }
    }
  }
}

// ============================================================================
// SECTION 10: POWER-UPS, SCORE & COMBO
// ============================================================================
function maybeDropPowerUp(x,y){
  const roll=Math.random();let t;
  if(roll<0.35)t='spread';else if(roll<0.45)t='shield';else if(roll<0.75)t='heal';else t='speed';
  acquirePowerUp(x,y,t);
}

function applyPowerUp(pu){
  if(!pu||!pu.active)return;pu.active=false;playSound('powerUp');
  const p=GAME.player;if(!p)return;
  // Reset big bang thresholds when healed above them
  if(!GAME._bigBangTriggered)GAME._bigBangTriggered={};
  if(p.hp>5)GAME._bigBangTriggered[5]=false;
  if(p.hp>3)GAME._bigBangTriggered[3]=false;
  if(p.hp>1)GAME._bigBangTriggered[1]=false;
  switch(pu.type){
    case'spread':p.powerLevel=3;p._spreadTimer=10;break;
    case'shield':p._baseMaxHp=p._baseMaxHp||10;p.maxHp=p._baseMaxHp+1;p.hp=Math.min(p.hp+1,p.maxHp);p._shieldTimer=15;break;
    case'heal':p.hp=Math.min(p.hp+1,p.maxHp||10);break;
    case'speed':p._speedBoost=1.3;p._speedTimer=8;break;
  }
}

function addScore(base){
  if(GAME.gameState!=='playing')return;
  GAME.combo=(GAME.combo||0)+1;GAME.comboTimer=1.5;
  if(GAME.combo>GAME.maxCombo)GAME.maxCombo=GAME.combo;
  let mult=1;if(GAME.combo>=100)mult=10;else if(GAME.combo>=50)mult=5;else if(GAME.combo>=25)mult=3;else if(GAME.combo>=10)mult=2;
  GAME.score+=Math.floor(base*mult);
  // Score upgrade milestones (every 1M)
  const newLv=Math.floor(GAME.score/1000000);
  if(newLv>GAME.upgradeLevel){GAME.upgradeLevel=newLv;spawnComboText('战机升级! 伤害x'+(1+newLv),CANVAS_W/2,CANVAS_H/2-30);}
  checkMilestone(GAME.combo);
}

function checkMilestone(c){
  if(!GAME._comboMilestonesHit)GAME._comboMilestonesHit={};
  const m=GAME._comboMilestonesHit;
  if(c>=100&&!m[100]){m[100]=true;fireMilestone('完美!',100);}
  else if(c>=50&&!m[50]){m[50]=true;fireMilestone('惊人!',50);}
  else if(c>=25&&!m[25]){m[25]=true;fireMilestone('太棒了!',25);}
  else if(c>=10&&!m[10]){m[10]=true;fireMilestone('不错!',10);}
}

function fireMilestone(text,val){spawnComboText(text,CANVAS_W/2,300);sfxCombo(val);}
function updateComboTimer(dt){if(GAME.gameState!=='playing')return;if(GAME.comboTimer>0){GAME.comboTimer-=dt;if(GAME.comboTimer<=0){GAME.comboTimer=0;GAME.combo=0;GAME._comboMilestonesHit={};}}}

function checkPlayerDeath(dt){
  if(GAME.gameState!=='playing')return;if(!GAME._deathStarted)return;
  GAME._deathTimer-=dt;if(GAME._deathTimer<=0){gameOver();}
}

  GAME._effectCooldowns={lightning:0,sweep:0,burst:0,meteor:0,scatter:0,sideShot:0,iceStorm:0,laserSweep:0};
  GAME._lightningBaseCooldown=1.0;GAME.upgradeLevel=0;GAME._bigBangTriggered={};GAME.effectBurstActive=false;GAME.effectSweepActive=false;
  GAME.bossActive=false;GAME.bossWarning=0;GAME.bossWarningTimer=0;GAME._deathStarted=false;GAME._deathTimer=0;GAME._deathTriggered=false;

  GAME._effectCooldowns.sweep=0.5;GAME._effectCooldowns.burst=0.5;
  GAME._effectCooldowns.meteor=0.5;GAME._effectCooldowns.scatter=0.5;
  GAME._effectCooldowns.sideShot=0.5;GAME._effectCooldowns.iceStorm=0.5;
  for(let i=0;i<GAME.enemies.length;i++)GAME.enemies[i].active=false;
  for(let i=0;i<GAME.powerUps.length;i++)GAME.powerUps[i].active=false;

}

function gameOver(){
  if(GAME._deathTriggered)return;GAME._deathTriggered=true;
  GAME.gameState='gameover';sfxMusicStop();playSound('gameOver');
  for(let i=0;i<GAME.enemies.length;i++)GAME.enemies[i].active=false;
  for(let i=0;i<GAME.enemyBullets.length;i++)GAME.enemyBullets[i].active=false;
  for(let i=0;i<GAME.playerBullets.length;i++)GAME.playerBullets[i].active=false;
  document.getElementById('final-score').textContent=formatScore(GAME.score)+' 分';
  document.getElementById('final-stats').textContent='抵达第 '+GAME.wave+' 波 · 最大连击 '+GAME.maxCombo+'x';

}

function restartGame(){GAME._deathTriggered=false;GAME._deathStarted=false;startGame();}

function syncGameUI(){
  const active=GAME.gameState==='playing'||GAME.gameState==='paused';
  const tools=document.getElementById('game-tools');if(tools)tools.style.display=active?'flex':'none';
  const joy=document.getElementById('m-joy');if(joy)joy.style.display=GAME.gameState==='playing'?'block':'none';

}

function togglePause(){
  if(GAME.gameState==='playing')GAME.gameState='paused';
  else if(GAME.gameState==='paused')GAME.gameState='playing';
  syncGameUI();
}

function toggleSound(){

  const btn=document.getElementById('sound-btn');if(!btn)return;

function returnToTitle(){

// ============================================================================
// SECTION 12: RENDERER — Background
// ============================================================================
const starLayers=[[],[],[]];let starsInit=false;
function initStars(){
  for(let i=0;i<90;i++)starLayers[0].push({x:Math.random()*CANVAS_W,y:Math.random()*CANVAS_H,s:0.6+Math.random()*1.2,a:0.2+Math.random()*0.4,spd:0.3+Math.random()*0.4,tw:Math.random()*Math.PI*2,twSpd:0.02+Math.random()*0.04});
  for(let i=0;i<50;i++)starLayers[1].push({x:Math.random()*CANVAS_W,y:Math.random()*CANVAS_H,s:1+Math.random()*1.8,a:0.4+Math.random()*0.35,spd:0.6+Math.random()*0.6,tw:Math.random()*Math.PI*2,twSpd:0.03+Math.random()*0.05});
  for(let i=0;i<25;i++)starLayers[2].push({x:Math.random()*CANVAS_W,y:Math.random()*CANVAS_H,s:1.5+Math.random()*2.5,a:0.6+Math.random()*0.4,spd:1+Math.random()*1,tw:Math.random()*Math.PI*2,twSpd:0.04+Math.random()*0.06});
  starsInit=true;
}
let planets=[];
function drawBg(ctx){
  if(!starsInit)initStars();
  // Flat navy base + hard-stop facet bands (no soft gradient).
  ctx.fillStyle=COLORS.bgDeep;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.fillStyle=rgba(COLORS.bgMid,0.8);
  poly(ctx,[[-40,480],[340,-40],[560,-40],[180,480]]);ctx.fill();
  poly(ctx,[[420,480],[800,120],[840,300],[560,520]]);ctx.fill();
  ctx.fillStyle=rgba(COLORS.bgHigh,0.8);
  poly(ctx,[[560,-40],[840,-40],[840,200],[700,60]]);ctx.fill();
  poly(ctx,[[-40,120],[140,-40],[300,-40],[60,180]]);ctx.fill();
  const t=GAME.time||0;
  drawPaintedNebula(ctx,t);
  // A quiet postal route drifting behind the action — dashed straight polyline.
  ctx.save();ctx.strokeStyle='rgba(53,208,192,0.14)';ctx.lineWidth=1.5;ctx.setLineDash([5,10]);ctx.lineDashOffset=-t*7;
  ctx.beginPath();ctx.moveTo(-40,360);ctx.lineTo(170,250);ctx.lineTo(330,470);ctx.lineTo(520,310);ctx.lineTo(700,180);ctx.lineTo(850,120);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  for(let l=0;l<3;l++){const ss=starLayers[l];for(let i=0;i<ss.length;i++){const s=ss[i];let sy=(s.y+s.spd*t*60)%CANVAS_H;if(sy<0)sy+=CANVAS_H;const twA=s.a*(0.7+0.3*Math.sin(t*4+s.tw));if(l===2){drawStar4(ctx,s.x,sy,s.s*3,COLORS.starYellow,twA);}else{const r=s.s*0.9;ctx.fillStyle=rgba(COLORS.starYellow,twA);poly(ctx,[[s.x,sy-r],[s.x+r*.7,sy],[s.x,sy+r],[s.x-r*.7,sy]]);ctx.fill();}}}
  drawPlanets(ctx,t);
}

function drawPaintedNebula(ctx,t){
  const drift=Math.sin(t*0.12)*10;
  ctx.save();ctx.globalAlpha=0.08;
  const shapes=[
    {c:COLORS.mint,p:[[-70,350],[160,250],[340,430],[280,300]]},
    {c:COLORS.coral,p:[[120,40],[340,150],[560,60],[420,170]]},
    {c:COLORS.gold,p:[[-30,180],[210,90],[480,210],[260,260]]},
    {c:COLORS.skyBlue,p:[[400,440],[560,300],[780,420],[640,480]]},
    {c:COLORS.lavender,p:[[520,120],[700,40],[860,160],[700,220]]}
  ];
  for(let i=0;i<shapes.length;i++){const s=shapes[i];ctx.fillStyle=s.c;poly(ctx,s.p.map(pt=>[pt[0]+drift,pt[1]]));ctx.fill();}
  ctx.restore();
}

function drawPlanets(ctx,t){
  planets=planets.filter(p=>p.y<900);
  const ss=Math.floor(t*0.15);
  if(planets.length===0||planets[planets.length-1].y>300){if(((ss*17+31)%100)<8&&planets.length<3){const isRing=((ss*7+13)%3)!==0;planets.push({type:isRing?'ring':'moon',x:40+((ss*41+67)%400),y:-60,size:isRing?25+((ss*13)%20):18+((ss*23)%16),spd:0.4+((ss*11)%10)*0.06,ringAngle:((ss*29)%60-30)*Math.PI/180});}}
  for(let i=0;i<planets.length;i++){const p=planets[i];p.y+=p.spd;if(p.type==='ring')drawRingPlanet(ctx,p);else drawMoonPlanet(ctx,p);}
}

function drawRingPlanet(ctx,p){
  ctx.save();ctx.translate(p.x,p.y);
  // 10-gon two-tone body, black outlined.
  const pts=ngonPts(0,0,p.size,10,-Math.PI/2);
  inkedPoly(ctx,pts,'#FFB08A',2);
  poly(ctx,pts.slice(4).concat([[0,0]]));ctx.fillStyle=COLORS.roseGold;ctx.fill();
  // Straight-edged ring bands crossing the planet.
  ctx.save();ctx.rotate(p.ringAngle);ctx.globalAlpha=0.6;
  inkedPoly(ctx,[[-p.size*1.5,-p.size*0.16],[p.size*1.5,-p.size*0.16],[p.size*1.5,p.size*0.16],[-p.size*1.5,p.size*0.16]],COLORS.lavender,1.5);
  ctx.restore();
  ctx.restore();
}
function drawMoonPlanet(ctx,p){
  ctx.save();ctx.translate(p.x,p.y);
  const pts=ngonPts(0,0,p.size,10,-Math.PI/2);
  inkedPoly(ctx,pts,COLORS.mint,2);
  poly(ctx,pts.slice(4).concat([[0,0]]));ctx.fillStyle=COLORS.darkMint;ctx.fill();
  // Flat polygon craters in shadow tone.
  ctx.fillStyle=rgba(COLORS.darkMint,0.9);
  poly(ctx,ngonPts(-p.size*0.35,-p.size*0.3,p.size*0.2,6,0));ctx.fill();
  poly(ctx,ngonPts(p.size*0.3,-p.size*0.15,p.size*0.13,6,0));ctx.fill();
  ctx.restore();
}

// SECTION 13: RENDERER — Player, Enemies, Bullets, PowerUps
// ============================================================================
function fillAndInk(ctx,fill,stroke,width){ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke||'#000000';ctx.lineWidth=width||2.5;ctx.lineJoin='miter';ctx.miterLimit=2;ctx.stroke();}
// Low-poly helpers: straight-line polygon paths, no beziers.
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function inkedPoly(ctx,pts,fill,lw){poly(ctx,pts);fillAndInk(ctx,fill,null,lw);}
function facets(ctx,list,lw){for(let i=0;i<list.length;i++){poly(ctx,list[i][0]);fillAndInk(ctx,list[i][1],null,lw);}}
// Regular n-gon point ring (flat-topped), centered at cx,cy.
function ngonPts(cx,cy,r,n,rot){const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(rot||0)-Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return pts;}

function drawPlayer(ctx,x,y){
  if(!GAME.player)return;const inv=GAME.player.invincible;
  ctx.save();if(inv&&Math.floor((GAME.time||0)*20)%2===0)ctx.globalAlpha=0.25;

}

  poly(ctx,[[-24,2],[-34,5],[-27,13],[-15,8]]);ctx.fillStyle='#DED8CB';ctx.fill();

  // Hexagonal face: lit top, shadow bottom.
  facets(ctx,[
    [[[-13,-7],[-9,-18],[4,-21],[13,-10],[0,-4]],COLORS.softWhite],

  ],2.2);
  // Diamond eyes.

  ctx.fillStyle=COLORS.coral;poly(ctx,[[0,-4],[-2.1,-6.4],[2.1,-6.4]]);ctx.fill();
  ctx.strokeStyle='#000000';ctx.lineWidth=1.4;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(-4,-2);ctx.lineTo(0,-3.4);ctx.lineTo(4,-2);ctx.stroke();

  // Angular envelope badge.

  ctx.strokeStyle=COLORS.coral;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-5,8);ctx.lineTo(0,12.5);ctx.lineTo(5,8);ctx.stroke();
  ctx.strokeStyle=rgba(COLORS.white,.55);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-13,-6);ctx.lineTo(-14,2);ctx.lineTo(-11,8);ctx.stroke();

function drawEnemy(ctx,enemy){
  if(enemy._frozen||enemy._slowed){ctx.save();}
  switch(enemy.type){
    case'basic':drawBasicEnemy(ctx,enemy.x,enemy.y);break;
    case'fast':drawFastEnemy(ctx,enemy.x,enemy.y);break;
    case'tank':drawTankEnemy(ctx,enemy.x,enemy.y,enemy.hp,enemy.maxHp);break;
    case'boss':drawBoss(ctx,enemy.x,enemy.y,enemy.hp,enemy.maxHp);break;
    case'swarmer':drawSwarmerEnemy(ctx,enemy.x,enemy.y);break;
    case'splitter':drawSplitterEnemy(ctx,enemy.x,enemy.y);break;
    default:drawBasicEnemy(ctx,enemy.x,enemy.y);
  }
  if(enemy._frozen){
    // Ice crystal overlay
    const t=GAME.time||0;
    ctx.strokeStyle=rgba('#88DDFF',0.7+0.3*Math.sin(t*6));ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+6,0,Math.PI*2);ctx.stroke();
    // Ice spikes
    for(let s=0;s<6;s++){const a=s/6*Math.PI*2+t*2;ctx.fillStyle=rgba('#AAEEFF',0.6);ctx.beginPath();ctx.moveTo(enemy.x+Math.cos(a)*(enemy.radius+4),enemy.y+Math.sin(a)*(enemy.radius+4));ctx.lineTo(enemy.x+Math.cos(a+0.15)*(enemy.radius+10),enemy.y+Math.sin(a+0.15)*(enemy.radius+10));ctx.lineTo(enemy.x+Math.cos(a-0.15)*(enemy.radius+10),enemy.y+Math.sin(a-0.15)*(enemy.radius+10));ctx.closePath();ctx.fill();}
    ctx.fillStyle=rgba('#CCEEFF',0.3);ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+3,0,Math.PI*2);ctx.fill();
  }else if(enemy._slowed){
    ctx.strokeStyle=rgba('#88BBFF',0.4);ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.radius+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  if(enemy._frozen||enemy._slowed)ctx.restore();
}

function drawBasicEnemy(ctx,x,y){

  ctx.save();ctx.globalAlpha=0.22;poly(ctx,[[4,6],[18,16],[0,22],[-14,14]]);ctx.fillStyle='#000000';ctx.fill();ctx.restore();
  // Hexagonal body split along one diagonal: lit teal / shadow teal.
  const body=[[-16,4],[-11,-10],[0,-16],[12,-12],[18,0],[12,12],[-2,15],[-14,11]];
  facets(ctx,[
    [[[-16,4],[-11,-10],[0,-16],[12,-12],[18,0],[0,3]],COLORS.mint],
    [[[-16,4],[0,3],[18,0],[12,12],[-2,15],[-14,11]],COLORS.darkMint]
  ],2.8);
  // Angry polygon brows.
  ctx.fillStyle='#000000';poly(ctx,[[-9,-5],[-3,-2],[-3,-4.5],[-9,-7.5]]);ctx.fill();poly(ctx,[[9,-5],[3,-2],[3,-4.5],[9,-7.5]]);ctx.fill();

}

function drawFastEnemy(ctx,x,y){

function drawTankEnemy(ctx,x,y,hp,maxHp){

// Swarmer — tiny fast enemy, faceted star drone
function drawSwarmerEnemy(ctx,x,y){
  ctx.save();ctx.translate(x,y);ctx.scale(.58,.58);const t=GAME.time||0,bob=Math.sin(t*9+x)*1.5;ctx.translate(0,bob);ctx.rotate(Math.sin(t*7)*.12);

  // Two-tone star body: base purple, inner star shadow facet.
  ctx.beginPath();drawStar5Path(ctx,0,0,9,5,t*.8);fillAndInk(ctx,COLORS.lavender,null,2);
  ctx.beginPath();drawStar5Path(ctx,0,0,5,2.6,t*.8);ctx.fillStyle=COLORS.purple;ctx.fill();
  // Orange-red core with dot eyes.
  inkedPoly(ctx,ngonPts(0,0,3.7,8,Math.PI/8),COLORS.hostile,1.4);
  ctx.fillStyle='#000000';ctx.beginPath();ctx.arc(-1.3,-.5,.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(1.3,-.5,.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
// Splitter — medium enemy that splits into swarmers on death, star-shaped
function drawSplitterEnemy(ctx,x,y){
  ctx.save();ctx.translate(x,y);ctx.scale(.64,.64);const t=GAME.time||0,rot=t*.7;
  ctx.save();ctx.globalAlpha=0.22;poly(ctx,[[4,4],[18,14],[0,20],[-14,12]]);ctx.fillStyle='#000000';ctx.fill();ctx.restore();
  ctx.beginPath();drawStar5Path(ctx,0,0,15,8,rot);fillAndInk(ctx,COLORS.darkMint,null,2.7);
  // Alternating facet triangles per star point.
  ctx.save();ctx.rotate(rot);
  for(let i=0;i<5;i++){
    const a0=i/5*Math.PI*2-Math.PI/2,a1=(i+1)/5*Math.PI*2-Math.PI/2,am=(i+.5)/5*Math.PI*2-Math.PI/2;
    const tip=[Math.cos(a0)*15,Math.sin(a0)*15],mid=[Math.cos(am)*8,Math.sin(am)*8],base=[Math.cos(a1)*15,Math.sin(a1)*15];
    poly(ctx,[[0,0],tip,mid]);ctx.fillStyle=i%2?COLORS.skyBlue:COLORS.mint;ctx.fill();
    poly(ctx,[[0,0],mid,base]);ctx.fillStyle=i%2?COLORS.mint:COLORS.skyBlue;ctx.fill();
  }
  // Black zigzag crack.
  ctx.strokeStyle='#000000';ctx.lineWidth=2;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(-1,-10);ctx.lineTo(3,-4);ctx.lineTo(-1,1);ctx.lineTo(4,8);ctx.stroke();
  ctx.restore();
  // Cream diamond eyes.
  for(const ex of [-5,5]){poly(ctx,[[ex,-1],[ex+3.1,-1],[ex+3.1,1],[ex,1]]);ctx.fillStyle=COLORS.softWhite;ctx.fill();poly(ctx,[[ex+.8,-.7],[ex+1.9,-.7],[ex+1.9,.7],[ex+.8,.7]]);ctx.fillStyle='#000000';ctx.fill();}
  ctx.strokeStyle='#000000';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,5);ctx.lineTo(0,7);ctx.lineTo(3,5);ctx.stroke();
  ctx.restore();
}
// Helper: 5-point star path (for fill+stroke)
function drawStar5Path(ctx,cx,cy,outerR,innerR,rotation){
  ctx.beginPath();const pts=5,step=Math.PI/pts;
  for(let i=0;i<pts*2;i++){const r=i%2===0?outerR:innerR,a=i*step-Math.PI/2+rotation;if(i===0)ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);else ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();
}

  }else if(bullet._bossBullet){

function drawParticle(ctx,p){
  const lr=p.life/p.maxLife,sz=p.size*lr,alpha=(p.alpha||1)*lr;if(alpha<0.01)return;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation||0);
  if(p.isStar){ctx.restore();drawStar4(ctx,p.x,p.y,sz*1.5,p.color,alpha);}
  else if(p.isSpark){ctx.restore();
    // White core diamond + 4 short cross rays (no radial gradient).
    ctx.save();ctx.translate(p.x,p.y);
    ctx.fillStyle=rgba(p.color,alpha);poly(ctx,[[0,-sz*2],[sz*.5,0],[0,sz*2],[-sz*.5,0]]);ctx.fill();poly(ctx,[[-sz*2,0],[0,-sz*.5],[sz*2,0],[0,sz*.5]]);ctx.fill();
    ctx.fillStyle=rgba(COLORS.white,alpha);poly(ctx,[[0,-sz*.7],[sz*.7,0],[0,sz*.7],[-sz*.7,0]]);ctx.fill();ctx.restore();}
  else if(p.isRing){ctx.restore();ctx.save();ctx.strokeStyle=rgba(p.color,alpha);ctx.lineWidth=Math.max(1,sz*0.5);poly(ctx,ngonPts(p.x,p.y,sz,8,Math.PI/8));ctx.stroke();ctx.restore();}
  else{
    // Flat diamond shard + white glint.
    ctx.fillStyle=rgba(p.color,alpha);poly(ctx,[[0,-sz],[sz*.75,0],[0,sz],[-sz*.75,0]]);ctx.fill();
    ctx.fillStyle=rgba(COLORS.white,alpha*0.6);poly(ctx,[[0,-sz*.35],[sz*.3,0],[0,sz*.35],[-sz*.3,0]]);ctx.fill();
    ctx.restore();}
}
