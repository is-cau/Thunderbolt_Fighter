function drawSkillCooldowns(ctx){
  const skills=[
    {name:'闪电链',key:'lightning',color:'#FFD23F'},
    {name:'神龙摆尾',key:'sweep',color:'#3FD0F0'},
    {name:'冲击波',key:'burst',color:'#FF4D6D'},
    {name:'流星雨',key:'meteor',color:'#FF7A3C'},
    {name:'散射弹幕',key:'scatter',color:'#35D0C0'},
    {name:'侧方射击',key:'sideShot',color:'#8B6EF2'},
    {name:'寒冰风暴',key:'iceStorm',color:'#9BE8FF'},
    {name:'激光扫射',key:'laserSweep',color:'#FF3B30'},
  ];
  const barW=90,barH=6,gap=6,x0=CANVAS_W/2-((skills.length*barW+(skills.length-1)*gap)/2),y0=CANVAS_H-14;
  skills.forEach((s,i)=>{
    const sx=x0+i*(barW+gap);
    const cd=GAME._effectCooldowns[s.key]||0;
    const maxCd=s.key==='lightning'?GAME._lightningBaseCooldown:8;
    const ratio=1-Math.min(1,cd/maxCd);
    // Background (square corners)
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(sx,y0,barW,barH);
    // Fill
    if(ratio>0){ctx.fillStyle=s.color;ctx.fillRect(sx,y0,barW*ratio,barH);}
    // Border
    ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=1;ctx.strokeRect(sx,y0,barW,barH);
    // Label
    ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='bold 8px "Segoe UI","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(s.name,sx+barW/2,y0-2);
  });
}

function drawBossWarning(ctx){
  if(GAME.bossWarning>0){const p=0.5+0.5*Math.sin(GAME.time*8),a=GAME.bossWarning*p;ctx.strokeStyle=rgba(COLORS.hostile,a);ctx.lineWidth=4;ctx.strokeRect(2,2,CANVAS_W-4,CANVAS_H-4);if(a>0.4){ctx.font='bold 28px "Segoe UI","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillStyle=rgba('#000000',a);ctx.fillText('警告',CANVAS_W/2+2,CANVAS_H/2-8);ctx.fillStyle=rgba(COLORS.hostile,a);ctx.fillText('警告',CANVAS_W/2,CANVAS_H/2-10);ctx.font='bold 16px "Segoe UI","Microsoft YaHei",sans-serif';ctx.fillStyle=rgba('#000000',a*0.8);ctx.fillText('BOSS 来袭!',CANVAS_W/2+2,CANVAS_H/2+22);ctx.fillStyle=rgba(COLORS.starYellow,a*0.9);ctx.fillText('BOSS 来袭!',CANVAS_W/2,CANVAS_H/2+20);}}
}

function drawShieldBubble(ctx){
  const p=GAME.player;if(!p||!p.active)return;
  const a=(GAME.skill3Timer/3)*0.25+0.1*Math.sin(GAME.time*6);
  ctx.strokeStyle=rgba(COLORS.lavender,a);ctx.lineWidth=3;
  poly(ctx,ngonPts(p.x,p.y,30+Math.sin(GAME.time*8)*3,8,Math.PI/8));ctx.stroke();
}

// 闪电链渲染 — 从战机发射 (per chain)
function drawLightningChain(ctx,lc){
  const chain=lc.enemies;if(!chain||chain.length<2)return;
  ctx.save();ctx.globalAlpha=0.95;
  // 3-pass stroke: black underlay → yellow → white core (no glow).
  const passes=[{c:'#000000',w:6,j:25},{c:'#FFD23F',w:3.5,j:25},{c:'#FFFFFF',w:1.5,j:15}];
  for(let pi=0;pi<passes.length;pi++){const pass=passes[pi];ctx.strokeStyle=pass.c;ctx.lineWidth=pass.w;ctx.lineCap='butt';ctx.lineJoin='miter';
    for(let i=0;i<chain.length-1;i++){
      const a=chain[i],b=chain[i+1];ctx.beginPath();ctx.moveTo(a.x,a.y);
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy),seg=Math.max(3,Math.floor(dist/15));
      for(let s=1;s<=seg;s++){ctx.lineTo(a.x+dx*s/seg+(Math.random()-0.5)*pass.j,a.y+dy*s/seg+(Math.random()-0.5)*pass.j);}
      ctx.lineTo(b.x,b.y);ctx.stroke();
    }
  }
  ctx.restore();
}

// 神龙摆尾效果 — horizontal beam line from player
function drawSweepEffect(ctx){
  const p=GAME.player;if(!p||!p.active)return;
  const a=Math.sin(GAME.time*8)*Math.PI*0.6;ctx.save();
  const dirs=[a-Math.PI*0.5,a+Math.PI*0.5];
  for(const d of dirs){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(d)*500,p.y+Math.sin(d)*500);}
  ctx.globalAlpha=0.8;ctx.strokeStyle='#000000';ctx.lineWidth=6;ctx.stroke();
  ctx.globalAlpha=0.9;ctx.strokeStyle='#3FD0F0';ctx.lineWidth=2.5;ctx.stroke();
  ctx.restore();
}

// 流星雨渲染
function drawMeteorEffect(ctx){
  for(let i=0;i<GAME.effectMeteors.length;i++){
    const m=GAME.effectMeteors[i];
    // Trail: straight line.
    ctx.strokeStyle=rgba(COLORS.coral,0.5);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*0.05,m.y-m.vy*0.05);ctx.stroke();
    // Stacked flat shapes: orange decagon, yellow octagon, white diamond.
    poly(ctx,ngonPts(m.x,m.y,12,10,Math.PI/10));ctx.fillStyle=COLORS.coral;ctx.fill();
    poly(ctx,ngonPts(m.x,m.y,7,8,Math.PI/8));ctx.fillStyle=COLORS.gold;ctx.fill();
    poly(ctx,[[m.x,m.y-3],[m.x+3,m.y],[m.x,m.y+3],[m.x-3,m.y]]);ctx.fillStyle=COLORS.white;ctx.fill();
  }
}

// 单束激光渲染
function drawSingleBeam(ctx,angle,glowColor){
  const p=GAME.player;if(!p||!p.active)return;
  const beamLen=Math.sqrt(CANVAS_W*CANVAS_W+CANVAS_H*CANVAS_H);
  const ex=p.x+Math.sin(angle)*beamLen,ey=p.y-Math.cos(angle)*beamLen;
  const t=GAME.time||0,dx=ex-p.x,dy=ey-p.y,len=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/len,ny=dx/len;
  ctx.save();ctx.lineCap='butt';
  // Black outline pass, orange body, cream core (offset slightly by nx/ny).
  ctx.strokeStyle='#000000';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle=COLORS.coral;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle=COLORS.softWhite;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(p.x+nx*1.2,p.y+ny*1.2);ctx.lineTo(ex+nx*1.2,ey+ny*1.2);ctx.stroke();
  // Floating facet sparkles along the beam.
  const segs=Math.floor(beamLen/34),phase=Math.floor(t*9);
  for(let s=1;s<segs;s++){if((s+phase)%4!==0)continue;const sx=p.x+dx*s/segs,sy=p.y+dy*s/segs,off=Math.sin(s*2.1+t*5)*7;ctx.fillStyle=s%2?COLORS.gold:COLORS.coral;poly(ctx,[[sx+nx*off,sy+ny*off-3],[sx+nx*off+2.4,sy+ny*off],[sx+nx*off,sy+ny*off+3],[sx+nx*off-2.4,sy+ny*off]]);ctx.fill();}
  ctx.restore();
}
// 激光扫射渲染 — dual beams from left, opposite rotation
function drawLaserSweep(ctx){
  const p=GAME.player;if(!p||!p.active)return;
  ctx.save();
  drawSingleBeam(ctx,GAME._laserSweepAngle1||0);
  drawSingleBeam(ctx,GAME._laserSweepAngle2||0);
  // Faceted rosette at the beam origin.
  const t=GAME.time||0;ctx.translate(p.x,p.y);ctx.rotate(t*2);
  for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillStyle=rgba(i%2?COLORS.gold:COLORS.coral,.7);poly(ctx,[[-3.2,-10],[3.2,-10],[2,-20],[-2,-20]]);ctx.fill();}
  inkedPoly(ctx,ngonPts(0,0,6,8,Math.PI/8),COLORS.softWhite,1.5);ctx.restore();
}

// ============================================================================
// SECTION 15: HELPER DRAWING FUNCTIONS
// ============================================================================
function rgba(hex,alpha){if(alpha>=1)return hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+alpha.toFixed(3)+')';}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawPaintPanel(ctx,x,y,w,h,fill,accent){
  // Flat chamfered panel: black border, accent as left bar (no waves/offset shadow).
  const c=6;
  const path=[[x+c,y],[x+w,y],[x+w,y+h-c],[x+w-c,y+h],[x,y+h],[x,y+c]];
  poly(ctx,path);
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle='#000000';ctx.lineWidth=2.5;ctx.lineJoin='miter';ctx.stroke();
  ctx.fillStyle=accent;poly(ctx,[[x+c,y],[x+c+4,y],[x+4,y+h],[x,y+h],[x,y+c]]);ctx.fill();
  ctx.strokeStyle='#000000';ctx.lineWidth=1.2;ctx.stroke();
}

function drawHeart(ctx,cx,cy,size,color,alpha){
  // 7-vertex angular heart, legible from HUD size 8 to powerup size 11.
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;const s=size*0.5;
  ctx.beginPath();
  ctx.moveTo(cx,cy+s*1.4);
  ctx.lineTo(cx-s*1.3,cy+s*0.1);
  ctx.lineTo(cx-s*1.3,cy-s*0.6);
  ctx.lineTo(cx-s*0.55,cy-s*0.75);
  ctx.lineTo(cx,cy-s*0.3);
  ctx.lineTo(cx+s*0.55,cy-s*0.75);
  ctx.lineTo(cx+s*1.3,cy-s*0.6);
  ctx.lineTo(cx+s*1.3,cy+s*0.1);
  ctx.closePath();ctx.fill();
  if(size>=10){ctx.globalAlpha=alpha;ctx.strokeStyle='#000000';ctx.lineWidth=1;ctx.lineJoin='miter';ctx.stroke();}
  ctx.restore();
}

function drawStar4(ctx,cx,cy,size,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;const hw=size*0.35,hh=size;
  ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx+hw*0.3,cy-hw*0.2);ctx.lineTo(cx+hw,cy);ctx.lineTo(cx+hw*0.3,cy+hw*0.2);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx-hw*0.3,cy+hw*0.2);ctx.lineTo(cx-hw,cy);ctx.lineTo(cx-hw*0.3,cy-hw*0.2);ctx.closePath();ctx.fill();ctx.restore();
}

function drawStar5(ctx,cx,cy,outerR,innerR,color,rotation){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation||0);ctx.fillStyle=color;
  ctx.beginPath();const pts=5,step=Math.PI/pts;
  for(let i=0;i<pts*2;i++){const r=i%2===0?outerR:innerR,a=i*step-Math.PI/2;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.restore();
}

function drawHpBar(ctx,x,y,w,hp,maxHp){
  if(maxHp<=0)return;
  // Flat square track + teal fill, black border.
  ctx.fillStyle='#000000';ctx.fillRect(x-w/2-1,y-1,w+2,7);
  ctx.fillStyle=COLORS.bgMid;ctx.fillRect(x-w/2,y,w,5);
  const ratio=Math.max(0,Math.min(1,hp/maxHp));if(ratio>0){ctx.fillStyle=COLORS.mint;ctx.fillRect(x-w/2,y,w*ratio,5);}
  ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=1;ctx.strokeRect(x-w/2,y,w,5);
}

function formatScore(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.floor(n));}

// ============================================================================
// SECTION 16: MAIN RENDER FUNCTION
// ============================================================================
function render(){
  const canvas=document.getElementById('gameCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,CANVAS_W*DPR,CANVAS_H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  // Screen shake offset
  let sx=0,sy=0;if(GAME.screenShake>0&&GAME.screenShakeDuration>0){sx=(Math.random()-0.5)*GAME.screenShake*2;sy=(Math.random()-0.5)*GAME.screenShake*2;}
  ctx.save();ctx.translate(sx,sy);
  drawBg(ctx);
  // Enemies
  for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(e.active)drawEnemy(ctx,e);}
  // Player bullets
  for(let i=0;i<GAME.playerBullets.length;i++){const b=GAME.playerBullets[i];if(b.active)drawPlayerBullet(ctx,b.x,b.y);}
  // Enemy bullets
  for(let i=0;i<GAME.enemyBullets.length;i++){const b=GAME.enemyBullets[i];if(b.active)drawEnemyBullet(ctx,b);}
  // Power-ups
  for(let i=0;i<GAME.powerUps.length;i++){const p=GAME.powerUps[i];if(p.active)drawPowerUp(ctx,p);}
  // Player
  if(GAME.player&&GAME.player.active){drawPlayer(ctx,GAME.player.x,GAME.player.y);
    // Shield bubble visual
    if(GAME.player._shieldTimer>0||GAME.player.invincible>0){
      const a=(GAME.player.invincible>0?0.5:0.3)+0.1*Math.sin(GAME.time*6);
      ctx.strokeStyle=rgba(COLORS.lavender,a);ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(GAME.player.x,GAME.player.y,14+Math.sin(GAME.time*8)*2,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=rgba(COLORS.skyBlue,a*0.2);
      ctx.beginPath();ctx.arc(GAME.player.x,GAME.player.y,14,0,Math.PI*2);ctx.fill();
    }
  }
  // Particles
  for(let i=0;i<GAME.particles.length;i++){const p=GAME.particles[i];if(p.active)drawParticle(ctx,p);}
  ctx.restore();
  // Auto-trigger effect visuals
  for(let i=0;i<GAME.lightningChains.length;i++)drawLightningChain(ctx,GAME.lightningChains[i]);
  if(GAME.activeEffect==='sweep')drawSweepEffect(ctx);
  if(GAME.activeEffect==='meteor')drawMeteorEffect(ctx);
  if(GAME.activeEffect==='laserSweep'){
    drawLaserSweep(ctx);
    if(GAME.player&&GAME.player.active)drawPlayer(ctx,GAME.player.x,GAME.player.y);
  }
  // HUD
  drawHUD(ctx);drawComboTexts(ctx);drawScreenFlash(ctx);drawBossWarning(ctx);drawSkillCooldowns(ctx);
  // Pause overlay
  document.getElementById('pause-overlay').style.display=GAME.gameState==='paused'?'flex':'none';
}

// ============================================================================
// SECTION 17: STARTUP & EVENT HANDLERS
// ============================================================================
function drawPreviewShip(){
  const c=document.getElementById('previewCanvas');if(!c)return;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,160,160);
  drawPlayerArt(ctx,80,85,2.05,performance.now()/1000,2);
}

// Click handlers
async function lockLandscape(){
  try{
    // 先请求全屏，必须 await 完成后才能锁定方向
    const el=document.documentElement;
    if(el.requestFullscreen){
      await el.requestFullscreen().catch(()=>{});
    }else if(el.webkitRequestFullscreen){
      await el.webkitRequestFullscreen().catch(()=>{});
    }
    // 全屏后再锁定横屏
    if(screen.orientation&&screen.orientation.lock){
      await screen.orientation.lock('landscape').catch(()=>{});
    }
  }catch(e){}
}
function handleStartClick(){initAudio();if(GAME.gameState==='start'||GAME.gameState==='gameover'){lockLandscape().then(()=>{startGame();});}}
function handleRestartClick(){restartGame();}

// JS方向检测——作为CSS media query的补充，适配更多移动浏览器
function checkOrientation(){const hint=document.getElementById('rotate-hint');if(!hint)return;const isPortrait=window.innerWidth<window.innerHeight;if(isPortrait){hint.style.display='flex';}else{hint.style.display='none';}}
window.addEventListener('orientationchange',checkOrientation);window.addEventListener('resize',checkOrientation);

// Canvas auto-scales via CSS (max-width:100vw, max-height:100vh, object-fit:contain)

// Initialization
window.onload=function(){
  const canvas=document.getElementById('gameCanvas');if(canvas){canvas.width=CANVAS_W*DPR;canvas.height=CANVAS_H*DPR;}
  initPools();initInput();createPlayer();initGameLoop();drawPreviewShip();checkOrientation();
  // Show start screen
  document.getElementById('start-screen').style.display='flex';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('pause-overlay').style.display='none';
};
</script>
