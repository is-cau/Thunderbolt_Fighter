<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thunderbolt Fighter - 雷霆战机</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000;
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  touch-action:none;
}
body {
  display:flex; justify-content:center; align-items:center;
}
#game-wrapper {
  position:relative;
  width:100vw; height:100vh;
  display:flex; justify-content:center; align-items:center;
}
canvas {
  display:block;
  width:100vw; height:100vh;
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
  transform:translateZ(0);
  backface-visibility:hidden;
}
/* Start Screen */
#start-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:linear-gradient(180deg, #1A0A3E 0%, #2D1B4E 50%, #0F0530 100%);
  z-index:20;
}
#start-screen h1 {
  font-size:42px; color:#FFE156;
  text-shadow:0 0 20px rgba(255,225,86,0.5), 0 4px 8px rgba(0,0,0,0.5);
  margin-bottom:8px; letter-spacing:2px;
}
#start-screen .subtitle {
  font-size:16px; color:#FFB5C2; margin-bottom:40px;
  text-shadow:0 0 10px rgba(255,181,194,0.4);
}
#start-screen .ship-preview {
  width:80px; height:80px; margin-bottom:30px;
  animation: float 2s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-12px); }
}
#start-btn {
  pointer-events:auto;
  padding:14px 60px; font-size:22px; font-weight:bold;
  color:#2D1B4E; background:linear-gradient(135deg, #FFE156, #FFB5C2);
  border:none; border-radius:30px; cursor:pointer;
  box-shadow:0 0 20px rgba(255,225,86,0.4);
  transition:transform 0.15s, box-shadow 0.15s;
  letter-spacing:1px;
}
#start-btn:hover { transform:scale(1.05); box-shadow:0 0 30px rgba(255,225,86,0.6); }
#start-btn:active { transform:scale(0.95); }
.start-hint {
  margin-top:20px; font-size:13px; color:rgba(255,255,255,0.5);
}
/* Game Over Screen */
#gameover-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; flex-direction:column; justify-content:center; align-items:center;
  background:rgba(10,5,20,0.85); z-index:20;
}
#gameover-screen h2 {
  font-size:36px; color:#FF6B8A; margin-bottom:10px;
  text-shadow:0 0 15px rgba(255,107,138,0.5);
}
#gameover-screen .final-score {
  font-size:28px; color:#FFE156; margin-bottom:5px;
}
#gameover-screen .stats {
  font-size:14px; color:rgba(255,255,255,0.6); margin-bottom:25px;
}
#restart-btn {
  pointer-events:auto;
  padding:12px 50px; font-size:20px; font-weight:bold;
  color:#fff; background:linear-gradient(135deg, #FF6B8A, #C7CEEA);
  border:none; border-radius:25px; cursor:pointer;
  box-shadow:0 0 15px rgba(255,107,138,0.3);
  transition:transform 0.15s;
}
#restart-btn:hover { transform:scale(1.05); }
#restart-btn:active { transform:scale(0.95); }
/* Pause overlay */
#pause-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; justify-content:center; align-items:center;
  background:rgba(10,5,20,0.7); z-index:15;
  font-size:32px; color:#FFE156;
  text-shadow:0 0 15px rgba(255,225,86,0.5);
}
/* Responsive */
@media (max-width:500px) {
  #start-screen h1 { font-size:30px; }
  #start-screen .subtitle { font-size:14px; }
  #start-btn { padding:12px 45px; font-size:18px; }
}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1>雷霆战机</h1>
    <div class="subtitle">Thunderbolt Fighter</div>
    <canvas class="ship-preview" id="previewCanvas" width="80" height="80"></canvas>
    <button id="start-btn" onclick="handleStartClick()">START</button>
    <div class="start-hint" id="start-hint">鼠标移动 · 自动射击 · P暂停</div>
  </div>
  <!-- Game Over Screen -->
  <div id="gameover-screen">
    <h2>游戏结束</h2>
    <div class="final-score" id="final-score">分数: 0</div>
    <div class="stats" id="final-stats">波次 1 · 最大连击 0x</div>
    <button id="restart-btn" onclick="handleRestartClick()">再来一局</button>
  </div>
  <!-- Pause -->
  <div id="pause-overlay">已暂停</div>
</div>

<script>
// ============================================================================
// THUNDERBOLT FIGHTER — 雷霆战机 (Cute Edition)
// Single-file HTML5 Canvas game. All sprites & sounds are procedural.
// ============================================================================

// ============================================================================
// SECTION 1: CONSTANTS & GAME STATE
// ============================================================================
const CANVAS_W = 800, CANVAS_H = 480;
const COLORS = {
  pink:'#FFB5C2', hotPink:'#FF6B8A', mint:'#B5EAD7', lavender:'#C7CEEA',
  peach:'#FFDAC1', butter:'#FFFFD8', coral:'#FF9AA2', skyBlue:'#A0D2F0',
  purple:'#D5C6E0', gold:'#FFE156', white:'#FFFFFF', darkPurple:'#2D1B4E',
  starYellow:'#FFF5BA', darkMint:'#7ECBAA', deepBlue:'#1A0A3E',
  darkPink:'#E8557A', softWhite:'#FFF0F3', charcoal:'#3D2B5A',
  blushPink:'#FFD1DC', roseGold:'#F7A8B8', skyLight:'#C5E8F7', berry:'#B8476A'
};

const GAME = {
  player:null, enemies:[], enemyBullets:[], playerBullets:[],
  particles:[], powerUps:[], comboTexts:[],
  score:0, combo:0, maxCombo:0, wave:1, waveTimer:0,
  gameState:'start', // start|playing|paused|gameover
  screenShake:0, screenShakeDuration:0, flashAlpha:0,
  slowMotion:1, slowMotionTimer:0,
  bossActive:false, bossWarning:0, bossWarningTimer:0,
  time:0, dt:0,
  // Mouse
  mouseX:240, mouseY:400, mouseOnCanvas:false,
  // Auto-trigger special effects
  autoEffectTimer:0, autoEffectInterval:3, // seconds between auto effects
  activeEffect:null, effectDisplayName:'', effectTimer:0, // currently active effect
  lightningActive:false, lightningTimer:0, // lightning runs concurrently
  effectLightning:[], effectMeteors:[], // effect data arrays
  _effectCooldowns:{lightning:0,sweep:0,burst:0,meteor:0,scatter:0,sideShot:0}, // per-effect cooldowns
  _lightningBaseCooldown:1.0, // decreases by 0.1 each trigger
  // Wave tracking
  currentWave:0, waveSpawnQueue:[], waveSpawnTimer:0,
  waveEnemyIndex:0, waveBossDef:null, waveBossSpawned:false,
  waveBossDead:false, waveCleared:false, waveClearTimer:0,
  // Death
  _deathStarted:false, _deathTimer:0, _deathTriggered:false,
  _comboMilestonesHit:{}, comboTimer:0
};

// ============================================================================
// SECTION 2: AUDIO SYSTEM (Web Audio API — procedural sounds)
// ============================================================================
let audioCtx=null, masterGain=null, audioReady=false;
let shootToggle=false, musicInterval=null;

function initAudio(){if(audioReady)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=0.3;masterGain.connect(audioCtx.destination);audioReady=true;}catch(e){console.warn('Audio not available:',e);}}

function createNoise(dur){if(!audioReady)return null;const sr=audioCtx.sampleRate,len=Math.floor(sr*dur);const buf=audioCtx.createBuffer(1,len,sr);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return buf;}

function createVoice(type,freq,gainVal,offset){
  if(!audioReady)return null;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type=type;osc.frequency.value=freq;g.gain.value=gainVal||0;
  osc.connect(g);g.connect(masterGain);
  osc.start(audioCtx.currentTime+(offset||0));
  return {osc,g};
}

// SFX Functions
function sfxShoot(){
  if(!audioReady)return;shootToggle=!shootToggle;
  const v=createVoice('square',shootToggle?800:760,0);if(!v)return;
  const t=audioCtx.currentTime,d=0.08;
  v.osc.frequency.setValueAtTime(shootToggle?800:760,t);
  v.osc.frequency.linearRampToValueAtTime((shootToggle?800:760)*0.5,t+d);
  v.g.gain.setValueAtTime(0.001,t);v.g.gain.linearRampToValueAtTime(0.22,t+0.005);
  v.g.gain.exponentialRampToValueAtTime(0.001,t+d);
  v.osc.stop(t+d+0.01);
}

function sfxEnemyShoot(){
  if(!audioReady)return;const v=createVoice('sine',1200,0);if(!v)return;
  const t=audioCtx.currentTime,d=0.06;
  v.osc.frequency.linearRampToValueAtTime(600,t+d);
  v.g.gain.setValueAtTime(0.001,t);v.g.gain.linearRampToValueAtTime(0.12,t+0.003);
  v.g.gain.exponentialRampToValueAtTime(0.001,t+d);v.osc.stop(t+d+0.01);
}

function sfxExplode(size){
  if(!audioReady)return;const dur={small:0.15,medium:0.3,big:0.6}[size]||0.3;
  const buf=createNoise(dur);if(!buf)return;
  const src=audioCtx.createBufferSource(),g=audioCtx.createGain();
  src.buffer=buf;src.connect(g);g.connect(masterGain);
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.start(t);src.stop(t+dur+0.01);
  if(size==='big'){
    const r=createVoice('triangle',80,0);if(r){
      r.g.gain.setValueAtTime(0.25,t+0.01);r.g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      r.osc.frequency.linearRampToValueAtTime(40,t+0.5);r.osc.stop(t+0.55);
    }
  }
}

function sfxPlayerHit(){
  if(!audioReady)return;const t=audioCtx.currentTime;
  const th=createVoice('sine',100,0);if(th){
    th.g.gain.setValueAtTime(0.35,t+0.005);th.g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    th.osc.frequency.linearRampToValueAtTime(50,t+0.1);th.osc.stop(t+0.12);
  }
  const cb=createNoise(0.05);if(cb){
    const cs=audioCtx.createBufferSource(),cg=audioCtx.createGain();
    cs.buffer=cb;cs.connect(cg);cg.connect(masterGain);
    cg.gain.setValueAtTime(0.2,t);cg.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    cs.start(t);cs.stop(t+0.06);
  }
}

function sfxPowerUp(){
  if(!audioReady)return;[523,659,784].forEach((f,i)=>{
    const v=createVoice('triangle',f,0,i*0.07);if(!v)return;
    const t=audioCtx.currentTime+i*0.07;
    v.g.gain.setValueAtTime(0.22,t+0.01);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    v.osc.stop(t+0.1);
  });
}

function sfxBossWarning(){
  if(!audioReady)return;const t=audioCtx.currentTime;
  for(let i=0;i<10;i++){
    const v=createVoice('square',i%2===0?440:554,0,i*0.15);if(!v)continue;
    const s=t+i*0.15;v.g.gain.setValueAtTime(0.18,s+0.005);
    v.g.gain.exponentialRampToValueAtTime(0.001,s+0.15);v.osc.stop(s+0.16);
  }
}

function sfxBossDeath(){
  if(!audioReady)return;const t=audioCtx.currentTime;
  const nb=createNoise(0.6);if(nb){
    const ns=audioCtx.createBufferSource(),ng=audioCtx.createGain();
    ns.buffer=nb;ns.connect(ng);ng.connect(masterGain);
    ng.gain.setValueAtTime(0.35,t+0.01);ng.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    ns.start(t);ns.stop(t+0.65);
  }
  const r=createVoice('sawtooth',60,0);if(r){
    r.g.gain.setValueAtTime(0.25,t+0.02);r.g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    r.osc.frequency.linearRampToValueAtTime(30,t+0.5);r.osc.stop(t+0.55);
  }
  [392,330,262].forEach((f,i)=>{
    const v=createVoice('sine',f,0,0.55+i*0.15);if(!v)return;
    const s=t+0.55+i*0.15;
    v.g.gain.setValueAtTime(0.18,s+0.01);v.g.gain.exponentialRampToValueAtTime(0.001,s+0.15);
    v.osc.stop(s+0.17);
  });
}

function sfxCombo(level){
  if(!audioReady)return;
  let notes=[],nl=0.08,sparkle=false;
  if(level>=100){notes=[523,659,784,1047];nl=0.06;sparkle=true;}
  else if(level>=50){notes=[523,659,784];nl=0.07;sparkle=true;}
  else if(level>=25){notes=[659,880];nl=0.08;}
  else if(level>=10){notes=[659];nl=0.1;}
  else return;
  const t=audioCtx.currentTime;
  notes.forEach((f,i)=>{
    const v=createVoice('triangle',f,0,i*(nl-0.01));if(!v)return;
    const s=t+i*(nl-0.01);
    v.g.gain.setValueAtTime(0.2,s+0.01);v.g.gain.exponentialRampToValueAtTime(0.001,s+nl);
    v.osc.stop(s+nl+0.02);
  });
  if(sparkle){
    [2000,2400].forEach((f,i)=>{
      const v=createVoice('sine',f,0,i*0.02);if(!v)return;
      const s=t+i*0.02;v.g.gain.setValueAtTime(0.07,s+0.01);
      v.g.gain.exponentialRampToValueAtTime(0.001,s+0.25);v.osc.stop(s+0.28);
    });
  }
}

function sfxGameOver(){
  if(!audioReady)return;[392,330,262].forEach((f,i)=>{
    const v=createVoice('sine',f,0,i*0.25);if(!v)return;
    const t=audioCtx.currentTime+i*0.25;
    const lfo=audioCtx.createOscillator(),lfoG=audioCtx.createGain();
    lfo.type='sine';lfo.frequency.value=5;lfoG.gain.value=6;
    lfo.connect(lfoG);lfoG.connect(v.osc.frequency);
    lfo.start(t);lfo.stop(t+0.27);
    v.g.gain.setValueAtTime(0.28,t+0.02);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    v.osc.stop(t+0.28);
  });
}

function sfxMusicStart(){
  if(!audioReady||musicInterval)return;
  const scale=[262,294,330,392,440,523];
  const pat=[0,2,3,5,3,2,1,0];let step=0,nl=0.125;
  function note(){
    if(!audioReady||!musicInterval)return;
    const v=createVoice('triangle',scale[pat[step%8]],0);if(!v)return;
    const t=audioCtx.currentTime;
    v.g.gain.setValueAtTime(0.06,t+0.01);v.g.gain.exponentialRampToValueAtTime(0.001,t+nl);
    v.osc.stop(t+nl+0.02);step++;
  }
  note();musicInterval=setInterval(note,nl*1000);
}
function sfxMusicStop(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}}

// Generic sound dispatcher (used by engine)
function playSound(name){
  switch(name){
    case'shoot':sfxShoot();break;case'enemyShoot':sfxEnemyShoot();break;
    case'explode':case'enemyExplode':sfxExplode('medium');break;
    case'bigExplode':sfxExplode('big');break;case'smallExplode':sfxExplode('small');break;
    case'playerHit':sfxPlayerHit();break;case'powerUp':sfxPowerUp();break;
    case'bossWarning':sfxBossWarning();break;case'bossDeath':sfxBossDeath();break;
    case'combo':sfxCombo(GAME.combo);break;case'gameOver':sfxGameOver();break;
  }
}

// ============================================================================
// SECTION 3: OBJECT POOLS
// ============================================================================
function initPools(){
  let i;
  GAME.enemyBullets=[];for(i=0;i<500;i++)GAME.enemyBullets.push({x:0,y:0,vx:0,vy:0,w:8,h:8,radius:4,active:false,damage:1});
  GAME.playerBullets=[];for(i=0;i<300;i++)GAME.playerBullets.push({x:0,y:0,vx:0,vy:0,w:6,h:12,radius:3,active:false,damage:1});
  GAME.particles=[];for(i=0;i<800;i++)GAME.particles.push({x:0,y:0,vx:0,vy:0,active:false,life:0,maxLife:1,color:'#fff',alpha:1,size:4,rotation:0,rotationSpeed:0,isStar:false,isSpark:false,isRing:false});
  GAME.enemies=[];for(i=0;i<150;i++)GAME.enemies.push({x:0,y:0,vx:0,vy:0,w:32,h:32,radius:16,active:false,hp:1,maxHp:1,type:'basic',pattern:'straight',patternData:{},canShoot:false,shootInterval:2,_shootTimer:0});
  GAME.powerUps=[];for(i=0;i<20;i++)GAME.powerUps.push({x:0,y:0,vy:80,w:24,h:24,radius:12,active:false,type:'heal',wobbleTimer:0});
}

function findDead(pool){for(let i=0;i<pool.length;i++){if(!pool[i].active)return pool[i];}return null;}

function acquireBullet(pool,x,y,vx,vy,damage){
  const b=findDead(pool);if(!b)return null;
  b.active=true;b.x=x;b.y=y;b.vx=vx;b.vy=vy;b.damage=damage||1;return b;
}

function acquireEnemy(x,y,enemyType){
  const e=findDead(GAME.enemies);if(!e)return null;
  e.active=true;e.x=x;e.y=y;e.vx=0;e.vy=0;e.type=enemyType||'basic';e.hp=1;e.maxHp=1;
  e.w=32;e.h=32;e.radius=16;e.pattern='straight';e.patternData={};
  e.canShoot=false;e.shootInterval=2;e._shootTimer=0;return e;
}

function acquireParticle(x,y,vx,vy,color,size,life){
  const p=findDead(GAME.particles);if(!p)return null;
  p.active=true;p.x=x;p.y=y;p.vx=vx||0;p.vy=vy||0;
  p.color=color||'#fff';p.size=size||4;p.radius=(size||4)/2;
  p.life=life||0.5;p.maxLife=p.life;p.alpha=1;
  p.rotation=Math.random()*Math.PI*2;p.rotationSpeed=(Math.random()-0.5)*10;
  p.isStar=false;p.isSpark=false;p.isRing=false;return p;
}

function acquirePowerUp(x,y,type){
  const pu=findDead(GAME.powerUps);if(!pu)return null;
  pu.active=true;pu.x=x;pu.y=y;pu.type=type||'heal';pu.vy=80;
  pu.w=24;pu.h=24;pu.radius=12;pu.wobbleTimer=Math.random()*Math.PI*2;return pu;
}

// ============================================================================
// SECTION 4: INPUT HANDLER
// ============================================================================
const keys={};
const WATCHED=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD','Space','KeyZ','KeyP'];
WATCHED.forEach(k=>keys[k]=false);

let pauseToggle=false;

function onKD(e){if(WATCHED.includes(e.code)){e.preventDefault();keys[e.code]=true;}}
function onKU(e){if(WATCHED.includes(e.code)){e.preventDefault();keys[e.code]=false;}}
function isDown(code){return!!keys[code];}

function initInput(){
  document.addEventListener('keydown',onKD);document.addEventListener('keyup',onKU);
  const canvas=document.querySelector('canvas');if(!canvas)return;
  const isMobile='ontouchstart' in window&&navigator.maxTouchPoints>0&&window.innerWidth<1024;
  // Mouse tracking (always on, joystick overrides when active)
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    GAME.mouseX=(e.clientX-r.left)/r.width*CANVAS_W;
    GAME.mouseY=(e.clientY-r.top)/r.height*CANVAS_H;
    GAME.mouseOnCanvas=true;
  });
  canvas.addEventListener('mouseleave',()=>{GAME.mouseOnCanvas=false;});
  // Click to start
  canvas.addEventListener('click',()=>{if(GAME.gameState==='start'||GAME.gameState==='gameover')handleStartClick();});
  // Mobile joystick
  if(isMobile){
    document.getElementById('start-hint').textContent='摇杆移动 · 自动射击 · P暂停';
    const joy=document.createElement('div');joy.id='m-joy';joy.style.cssText='position:fixed;bottom:30px;left:30px;width:130px;height:130px;border-radius:65px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);z-index:200;touch-action:none;';
    const thumb=document.createElement('div');thumb.id='m-thumb';thumb.style.cssText='position:absolute;width:50px;height:50px;border-radius:25px;background:rgba(255,255,255,0.35);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;';
    joy.appendChild(thumb);document.body.appendChild(joy);
    let jId=null,jCX=0,jCY=0;
    joy.addEventListener('touchstart',e=>{e.preventDefault();if(jId!==null)return;const t=e.changedTouches[0];jId=t.identifier;const r=joy.getBoundingClientRect();jCX=r.left+r.width/2;jCY=r.top+r.height/2;GAME.mobileDX=0;GAME.mobileDY=0;},{passive:false});
    joy.addEventListener('touchmove',e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jId){const dx=e.changedTouches[i].clientX-jCX,dy=e.changedTouches[i].clientY-jCY;const maxR=55;let ndx=dx,ndy=dy,dist=Math.sqrt(dx*dx+dy*dy);if(dist>maxR){ndx=dx/dist*maxR;ndy=dy/dist*maxR;}GAME.mobileDX=ndx/maxR;GAME.mobileDY=ndy/maxR;GAME.mouseOnCanvas=true;const th=document.getElementById('m-thumb');if(th)th.style.transform='translate(calc(-50% + '+ndx+'px), calc(-50% + '+ndy+'px))';}}},{passive:false});
    joy.addEventListener('touchend',e=>{for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===jId){jId=null;GAME.mobileDX=0;GAME.mobileDY=0;GAME.mouseOnCanvas=false;const th=document.getElementById('m-thumb');if(th)th.style.transform='translate(-50%,-50%)';}}});
  }
}

// ============================================================================
// SECTION 5: COLLISION DETECTION
// ============================================================================
function circlesOverlap(a,b){
  const dx=a.x-b.x,dy=a.y-b.y;
  return dx*dx+dy*dy<((a.radius||8)+(b.radius||8))**2;
}

function checkCollisions(){
  if(GAME.gameState!=='playing')return;
  const player=GAME.player;if(!player||player.invincible===undefined)return;

  // Player bullets vs enemy bullets — cancel each other
  for(let i=0;i<GAME.playerBullets.length;i++){
    const pb=GAME.playerBullets[i];if(!pb.active)continue;
    for(let j=0;j<GAME.enemyBullets.length;j++){
      const eb=GAME.enemyBullets[j];if(!eb.active)continue;
      if(circlesOverlap(pb,eb)){pb.active=false;eb.active=false;
        acquireParticle(pb.x,pb.y,0,0,COLORS.starYellow,4,0.25);break;}
    }
  }

  // Enemy bullets vs player
  if(player.invincible<=0){
    for(let i=0;i<GAME.enemyBullets.length;i++){
      const b=GAME.enemyBullets[i];if(!b.active)continue;
      if(circlesOverlap(player,b)){b.active=false;hitPlayer(1);break;}
    }
  }
  // Player bullets vs enemies
  for(let i=0;i<GAME.playerBullets.length;i++){
    const pb=GAME.playerBullets[i];if(!pb.active)continue;
    for(let j=0;j<GAME.enemies.length;j++){
      const en=GAME.enemies[j];if(!en.active)continue;
      if(circlesOverlap(pb,en)){
        pb.active=false;en.hp-=pb.damage;
        if(en.hp<=0)onEnemyKilled(en);
        else{if(en.type==='boss')spawnHitSparks(en.x,en.y,pb.x,pb.y);}
        break;
      }
    }
  }
  // Player vs enemy body contact
  if(player.invincible<=0){
    for(let i=0;i<GAME.enemies.length;i++){
      const en=GAME.enemies[i];if(!en.active)continue;
      if(circlesOverlap(player,en)){hitPlayer(1);break;}
    }
  }
  // Player vs power-ups
  for(let i=0;i<GAME.powerUps.length;i++){
    const pu=GAME.powerUps[i];if(!pu.active)continue;
    if(circlesOverlap(player,pu)){applyPowerUp(pu);}
  }
}

function hitPlayer(dmg){
  if(GAME.player.invincible>0)return;
  GAME.player.hp-=dmg;GAME.player.invincible=2;GAME.combo=0;
  GAME.screenShake=8;GAME.screenShakeDuration=0.3;GAME.flashAlpha=0.35;
  spawnPlayerHitEffect(GAME.player.x,GAME.player.y);playSound('playerHit');
  if(GAME.player.hp<=0){GAME.player.hp=0;spawnPlayerDeath();}
}

function spawnPlayerDeath(){
  GAME.player.active=false;GAME._deathStarted=true;GAME._deathTimer=1.2;
  spawnExplosion(GAME.player.x,GAME.player.y,'player');
  GAME.screenShake=12;GAME.screenShakeDuration=1.0;GAME.flashAlpha=0.6;
}

function onEnemyKilled(enemy){
  const et=enemy.type;
  spawnExplosion(enemy.x,enemy.y,et);playSound(et==='tank'?'bigExplode':(et==='fast'||et==='swarmer'?'smallExplode':'explode'));
  addScore(enemy.scoreValue||100);
  if(Math.random()<0.35)maybeDropPowerUp(enemy.x,enemy.y);
  if(et==='boss')onBossDeath(enemy);
  // Splitter splits into 3 swarmers
  if(et==='splitter'){
    for(let i=0;i<3;i++){
      const sx=enemy.x+(Math.random()-0.5)*40,sy=enemy.y+(Math.random()-0.5)*20;
      const se=acquireEnemy(sx,sy,'swarmer');if(!se)continue;
      const td=ENEMY_TYPES.swarmer;se.hp=td.hp;se.maxHp=td.hp;se.speed=td.speed+Math.random()*50;se.scoreValue=td.score;se.w=se.h=td.size;se.radius=td.size/2;se.canShoot=false;se.shootInterval=0;
      se.pattern='straight';se.patternData={patternTimer:0,startX:sx,startY:sy};se._shootTimer=0;
    }
  }
  enemy.active=false;enemy.hp=0;
}

const FIXED_DT=1/60;let _lastTime=0,_accum=0,_rafId=null;

function initGameLoop(){_lastTime=performance.now();_accum=0;_rafId=requestAnimationFrame(loop);}

function loop(ts){
  _rafId=requestAnimationFrame(loop);
  let raw=(ts-_lastTime)/1000;_lastTime=ts;
  if(raw>0.25)raw=0.25;
  const scaled=raw*(GAME.slowMotion||1);_accum+=scaled;
  let steps=0;const maxSteps=Math.ceil(0.25/FIXED_DT);
  while(_accum>=FIXED_DT&&steps<maxSteps){update(FIXED_DT);_accum-=FIXED_DT;steps++;}
  if(steps>=maxSteps)_accum=0;
  GAME.dt=scaled;render();
}

function update(dt){
  GAME.time+=dt;
  // Pause toggle
  if(isDown('KeyP')){if(!pauseToggle){pauseToggle=true;if(GAME.gameState==='playing')GAME.gameState='paused';else if(GAME.gameState==='paused')GAME.gameState='playing';}}else pauseToggle=false;
  if(GAME.gameState!=='playing')return;
  GAME.waveTimer+=dt;
  updatePlayer(dt);updateEnemies(dt);updateBullets(dt);updateParticles(dt);
  updatePowerUps(dt);updateComboTexts(dt);updateEffects(dt);
  updateWaveSpawning(dt);updateSlowMotion(dt);updateComboTimer(dt);
  updateAmbientSpawns(dt);updateAutoEffects(dt);
  checkPlayerDeath(dt);checkCollisions();
}

function updatePlayer(dt){
  const p=GAME.player;if(!p||!p.active)return;
  // Mobile joystick or mouse-follow movement
  let mx=0,my=0;
  if((GAME.mobileDX||GAME.mobileDY)&&(GAME.mobileDX!==0||GAME.mobileDY!==0)){
    mx=GAME.mobileDX;my=GAME.mobileDY;
    let spd=(p.speed||550)*(p._speedBoost||1)*dt;
    p.x+=mx*spd;p.y+=my*spd;
  }else if(GAME.mouseOnCanvas){
    const dx=GAME.mouseX-p.x,dy=GAME.mouseY-p.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>2){mx=dx/dist;my=dy/dist;}
    let spd=Math.min(dist*14,750)*(p._speedBoost||1)*dt;
    if(spd>dist)spd=dist;
    p.x+=mx*spd;p.y+=my*spd;
  }else{
    // Keyboard fallback
    if(isDown('ArrowLeft')||isDown('KeyA'))mx=-1;
    if(isDown('ArrowRight')||isDown('KeyD'))mx=1;
    if(isDown('ArrowUp')||isDown('KeyW'))my=-1;
    if(isDown('ArrowDown')||isDown('KeyS'))my=1;
    if(mx!==0&&my!==0){const m=Math.sqrt(mx*mx+my*my);mx/=m;my/=m;}
    let spd=(p.speed||550)*(p._speedBoost||1);
    p.x+=mx*spd*dt;p.y+=my*spd*dt;
  }
  // Clamp to bounds
  p.x=Math.max(p.w/2,Math.min(CANVAS_W-p.w/2,p.x));
  p.y=Math.max(p.h/2,Math.min(CANVAS_H-p.h/2,p.y));
  // Auto-fire always on during gameplay
  if(p.shootCooldown>0)p.shootCooldown-=dt;
  if(p.shootCooldown<=0){
    p.shootCooldown=0.1;firePlayerBullets(p);
  }
  // Timers
  if(p._spreadTimer>0){p._spreadTimer-=dt;if(p._spreadTimer<=0){p._spreadTimer=0;p.powerLevel=1;}}
  if(p._speedTimer>0){p._speedTimer-=dt;if(p._speedTimer<=0){p._speedTimer=0;p._speedBoost=1;}}
  if(p._shieldTimer>0){p._shieldTimer-=dt;if(p._shieldTimer<=0){p._shieldTimer=0;}}
  if(p.invincible>0){p.invincible-=dt;if(p.invincible<0)p.invincible=0;}
}

function firePlayerBullets(p){
  const spd=-600,pool=GAME.playerBullets,lv=p.powerLevel||1,cx=p.x,cy=p.y-16;
  playSound('shoot');
  if(lv>=3){acquireBullet(pool,cx-10,cy,0,spd,1);acquireBullet(pool,cx,cy,0,spd,1);acquireBullet(pool,cx+10,cy,0,spd,1);}
  if(lv>=4){acquireBullet(pool,cx-20,cy+8,-80,spd*0.95,1);acquireBullet(pool,cx+20,cy+8,80,spd*0.95,1);}
  if(lv>=5){acquireBullet(pool,cx-26,cy+14,-150,spd*0.85,1);acquireBullet(pool,cx+26,cy+14,150,spd*0.85,1);}
  if(lv===2){acquireBullet(pool,cx-6,cy,0,spd,1);acquireBullet(pool,cx+6,cy,0,spd,1);}
  else if(lv===1)acquireBullet(pool,cx,cy,0,spd,1);
}

function updateEnemies(dt){
  for(let i=0;i<GAME.enemies.length;i++){
    const e=GAME.enemies[i];if(!e.active)continue;
    if(e.type==='boss')updateBoss(e,dt);
    else{updateEnemyPattern(e,dt);updateEnemyShooting(e,dt);}
    if(e.y>CANVAS_H+100||e.y<-100||e.x<-120||e.x>CANVAS_W+120){e.active=false;if(e.y>CANVAS_H+50)GAME.combo=0;}
  }
}

function updateBullets(dt){
  for(let i=0;i<GAME.playerBullets.length;i++){const b=GAME.playerBullets[i];if(!b.active)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20||b.y>CANVAS_H+20||b.x<-20||b.x>CANVAS_W+20)b.active=false;}
  for(let i=0;i<GAME.enemyBullets.length;i++){
    const b=GAME.enemyBullets[i];if(!b.active)continue;
    // Homing: track player
    if(b._homing&&GAME.player&&GAME.player.active){
      b._homingLife-=dt;if(b._homingLife<=0)b._homing=false;
      const dx=GAME.player.x-b.x,dy=GAME.player.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      b.vx+=(dx/d*speed-b.vx)*3*dt;b.vy+=(dy/d*speed-b.vy)*3*dt;
    }
    // Expanding bullets (burst pattern)
    if(b._expanding){b._expandSpd=(b._expandSpd||200)+100*dt;const a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*b._expandSpd;b.vy=Math.sin(a)*b._expandSpd;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-50||b.y>CANVAS_H+50||b.x<-50||b.x>CANVAS_W+50)b.active=false;
  }
}

function updateParticles(dt){
  for(let i=0;i<GAME.particles.length;i++){
    const p=GAME.particles[i];if(!p.active)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rotation+=p.rotationSpeed*dt;p.life-=dt;
    if(p.life<=0){p.active=false;}
    else{p.alpha=Math.max(0,p.life/p.maxLife);if(!p.isRing)p.size=(p.life/p.maxLife)*p.size;}
  }
}

function updatePowerUps(dt){
  for(let i=0;i<GAME.powerUps.length;i++){
    const pu=GAME.powerUps[i];if(!pu.active)continue;
    pu.wobbleTimer+=dt;pu.y+=pu.vy*dt;pu.x+=Math.sin(pu.wobbleTimer*3)*15*dt;
    if(pu.y>CANVAS_H+50)pu.active=false;
  }
}

function updateComboTexts(dt){
  for(let i=GAME.comboTexts.length-1;i>=0;i--){
    const ct=GAME.comboTexts[i];ct.y-=60*dt;ct.life-=dt;if(ct.life<=0)GAME.comboTexts.splice(i,1);
  }
}

function updateEffects(dt){
  if(GAME.screenShakeDuration>0){GAME.screenShakeDuration-=dt;if(GAME.screenShakeDuration<=0){GAME.screenShake=0;GAME.screenShakeDuration=0;}}
  if(GAME.flashAlpha>0){GAME.flashAlpha-=dt*2;if(GAME.flashAlpha<0)GAME.flashAlpha=0;}
}

function updateSlowMotion(dt){
  if(GAME.slowMotionTimer>0){GAME.slowMotionTimer-=dt;if(GAME.slowMotionTimer<=0){GAME.slowMotionTimer=0;GAME.slowMotion=1;}}
}

function updateEnemyPattern(enemy,dt){
  const pd=enemy.patternData;pd.patternTimer=(pd.patternTimer||0)+dt;
  if(pd.startX===undefined){pd.startX=enemy.x;pd.startY=enemy.y;}
  const t=pd.patternTimer,sx=pd.startX,sy=pd.startY,spd=enemy.speed||100;
  switch(enemy.pattern){
    case'straight':enemy.y+=spd*dt;break;
    case'sine':enemy.y+=spd*dt;enemy.x=sx+Math.sin(t*3)*60;break;
    case'zigzag':
      if(pd.zigT===undefined){pd.zigT=0;pd.vx=80;}pd.zigT+=dt;
      if(pd.zigT>=1.2){pd.zigT-=1.2;pd.vx=-pd.vx;}enemy.x+=pd.vx*dt;enemy.y+=120*dt;break;
    case'circle':
      if(pd.circT===undefined){pd.circT=0;pd.cx=sx;pd.cy=sy+80;}pd.circT+=dt;
      if(pd.circT<2.5){const a=pd.circT*2*Math.PI*0.7;enemy.x=pd.cx+Math.cos(a)*50;enemy.y=pd.cy+Math.sin(a)*50;}
      else enemy.y+=(spd+80)*dt;break;
    case'hover':
      if(pd.hovTarget===undefined){pd.hovTarget=Math.max(80,Math.min(CANVAS_H*0.35,sy+100));pd.hovDir=1;}
      if(enemy.y<pd.hovTarget){enemy.y+=spd*dt;if(enemy.y>pd.hovTarget)enemy.y=pd.hovTarget;}
      else{pd.hovSideT=(pd.hovSideT||0)+dt;enemy.x+=pd.hovDir*40*dt;if(pd.hovSideT>1.8){pd.hovSideT=0;pd.hovDir=-pd.hovDir;}if(enemy.x<50){enemy.x=50;pd.hovDir=1;}if(enemy.x>CANVAS_W-50){enemy.x=CANVAS_W-50;pd.hovDir=-1;}}break;
    case'charge':if(t<1.5)enemy.y+=20*dt;else enemy.y+=300*dt;break;
    default:enemy.y+=spd*dt;break;
  }
}

function updateEnemyShooting(enemy,dt){
  if(!enemy.canShoot||GAME.gameState!=='playing')return;enemy._shootTimer=(enemy._shootTimer||0)+dt;
  if(enemy._shootTimer<enemy.shootInterval)return;enemy._shootTimer=0;
  const p=GAME.player;if(!p||p.hp<=0)return;
  const dx=p.x-enemy.x,dy=p.y-enemy.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
  acquireBullet(GAME.enemyBullets,enemy.x,enemy.y+16,dx/dist*220,dy/dist*220,1);
  playSound('enemyShoot');
}

function startWave(num){
  let idx=num-1;if(idx>=WAVE_DEFS.length)idx=WAVE_DEFS.length-1;
  const wd=WAVE_DEFS[idx];
  const loopCount=Math.max(1,Math.floor(num/WAVE_DEFS.length)+1);
  GAME.currentWave=num;GAME.waveTimer=0;GAME.waveSpawnTimer=0.15;GAME.waveEnemyIndex=0;
  GAME.waveBossDef=wd.boss?{hp:wd.boss.hp*loopCount,score:wd.boss.score*loopCount}:null;
  GAME.waveBossSpawned=false;GAME.waveBossDead=false;
  GAME.waveCleared=false;GAME.waveClearTimer=0;GAME.bossWarning=0;GAME._waveEndTimer=0;
  GAME.wave=num;
  // Build spawn queue: halved delays, scaled counts
  let q=[];wd.enemies.forEach(g=>{const c=Math.floor(g.count*(0.8+loopCount*0.4));for(let e=0;e<c;e++)q.push({type:g.type,pattern:g.pattern,delay:Math.max(0.015,g.delay*0.25-loopCount*0.02)});});
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  GAME.waveSpawnQueue=q;
  if(typeof spawnComboText==='function')spawnComboText('第 '+num+' 波',CANVAS_W/2,400);
}

function updateWaveSpawning(dt){
  if(GAME.gameState!=='playing')return;
  if(GAME.bossWarning>0&&!GAME.waveBossSpawned){GAME.bossWarningTimer-=dt;if(GAME.bossWarningTimer<=0){spawnBoss(GAME.currentWave);GAME.waveBossSpawned=true;GAME.bossWarning=0;}return;}
  if(GAME.waveCleared){GAME.waveClearTimer+=dt;if(GAME.waveClearTimer>=0.3)startWave(GAME.currentWave+1);return;}
  const q=GAME.waveSpawnQueue;
  const warmup=Math.min(1,GAME.waveTimer/10);
  const waveSpeed=1+GAME.wave*0.8; // Each wave adds 80% spawn speed
  if(GAME.waveEnemyIndex<q.length){GAME.waveSpawnTimer+=dt*warmup*waveSpeed;const e=q[GAME.waveEnemyIndex];if(GAME.waveSpawnTimer>=e.delay){GAME.waveSpawnTimer=0;spawnWaveEnemy(e);GAME.waveEnemyIndex++;}}
  // Wave completion
  if(GAME.waveEnemyIndex>=q.length){
    if(GAME.waveBossDef&&!GAME.waveBossSpawned){
      // Boss wave: wait until no non-boss enemies alive, then trigger boss warning
      let nonBossAlive=false;for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(e.active&&e.type!=='boss'){nonBossAlive=true;break;}}
      if(!nonBossAlive&&GAME.bossWarning<=0){GAME.bossWarning=2;GAME.bossWarningTimer=2;playSound('bossWarning');}
    }else if(GAME.waveBossDead){
      // Boss killed: wave cleared
      GAME.waveCleared=true;GAME.waveClearTimer=0;
    }else if(!GAME.waveBossDef){
      // No boss: auto-complete 3s after all queued enemies spawned
      GAME._waveEndTimer=(GAME._waveEndTimer||0)+dt;
      if(GAME._waveEndTimer>=3.0){GAME.waveCleared=true;GAME.waveClearTimer=0;GAME._waveEndTimer=0;}
    }
  }
}

function spawnWaveEnemy(entry){
  const x=40+Math.random()*(CANVAS_W-80);
  const e=acquireEnemy(x,-30,entry.type);if(!e)return;
  const td=ENEMY_TYPES[entry.type];const scale=1+(GAME.wave-1)*0.2; // HP +20% per wave
  if(td){e.hp=Math.ceil(td.hp*scale);e.maxHp=e.hp;e.speed=td.speed;e.scoreValue=Math.ceil(td.score*scale);e.w=e.h=td.size;e.radius=td.size/2;e.canShoot=td.canShoot;e.shootInterval=td.shootInterval;}
  e.pattern=entry.pattern;e.patternData={patternTimer:0,startX:x,startY:-30};e._shootTimer=Math.random()*e.shootInterval;
}

// SECTION 9: BOSS SYSTEM

function spawnBoss(num){
  const e=acquireEnemy(CANVAS_W/2,-60,'boss');if(!e)return;
  const def=GAME.waveBossDef||{hp:200,score:5000};
  e.hp=def.hp*2;e.maxHp=e.hp;e.w=120;e.h=84;e.radius=50;e.speed=50;
  e.scoreValue=def.score;e.pattern='boss';e.canShoot=true;e.shootInterval=2.0;
  e.patternData={phase:1,moveDir:1,entered:false,_phaseMoveT:0,_sideT:0};e._shootTimer=0;e._patternChangeTimer=0;e._currentPattern='aimed';
  GAME.waveBossSpawned=true;GAME.waveBossDead=false;
}

function updateBoss(boss,dt){
  if(!boss||!boss.active)return;const pd=boss.patternData;
  pd.patternTimer=(pd.patternTimer||0)+dt;
  // Entry
  if(!pd.entered){boss.y+=50*dt;if(boss.y>=100){boss.y=100;pd.entered=true;GAME.bossActive=true;}return;}
  const hpPct=boss.hp/boss.maxHp;
  let phase=hpPct>0.7?1:(hpPct>0.4?2:3);
  if(phase!==pd.phase){pd.phase=phase;pd._phaseMoveT=0;}
  pd._phaseMoveT=(pd._phaseMoveT||0)+dt;
  // Movement
  switch(phase){
    case 1:boss.y=100;boss.x+=pd.moveDir*30*dt;pd._sideT=(pd._sideT||0)+dt;if(pd._sideT>2){pd._sideT=0;pd.moveDir=-pd.moveDir;}if(boss.x<80){boss.x=80;pd.moveDir=1;}if(boss.x>CANVAS_W-80){boss.x=CANVAS_W-80;pd.moveDir=-1;}break;
    case 2:boss.y=100+Math.sin(pd._phaseMoveT*1.5)*20;boss.x+=pd.moveDir*80*dt;if(boss.x<80||boss.x>CANVAS_W-80)pd.moveDir=-pd.moveDir;break;
    case 3:boss.y=100+Math.sin(pd._phaseMoveT*2.5)*40;boss.x+=pd.moveDir*120*dt;if(boss.x<60||boss.x>CANVAS_W-60)pd.moveDir=-pd.moveDir;break;
  }
  // Pattern change every 3 seconds
  boss._patternChangeTimer=(boss._patternChangeTimer||0)-dt;
  if(boss._patternChangeTimer<=0){
    boss._patternChangeTimer=3;
    const patterns=phase===1?['aimed','spread','double']:phase===2?['aimed','spread','ring','homing','double','wave']:['spread','ring','homing','homing','wave','double','spiral','burst'];
    boss._currentPattern=patterns[Math.floor(Math.random()*patterns.length)];
  }
  // Shooting
  boss._shootTimer=(boss._shootTimer||0)+dt;
  const iv=[0,2.0,2.0,2.0][phase];
  if(boss._shootTimer>=iv){boss._shootTimer=0;bossShoot(boss,phase);}
}

function bossShoot(boss,phase){
  const p=GAME.player;if(!p||p.hp<=0)return;
  const bx=boss.x,by=boss.y,dx=p.x-bx,dy=p.y-by,dist=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=180+phase*30;
  const pat=boss._currentPattern||'aimed';
  const mkBoss=function(x,y,vx,vy,dmg){const b=acquireBullet(GAME.enemyBullets,x,y,vx,vy,dmg||1);if(b){b._bossBullet=true;b.radius=6;b.w=b.h=12;}return b;};
  switch(pat){
    case'aimed':mkBoss(bx,by,dx/dist*spd,dy/dist*spd);break;
    case'spread':for(let a=-2;a<=2;a++){const ang=Math.atan2(dy,dx)+a*0.2;mkBoss(bx,by,Math.cos(ang)*spd,Math.sin(ang)*spd);}break;
    case'double':for(let a=-1;a<=1;a+=2){const ang=Math.atan2(dy,dx)+a*0.4;mkBoss(bx,by,Math.cos(ang)*spd,Math.sin(ang)*spd);}break;
    case'ring':for(let i=0;i<16;i++){const a=i/16*Math.PI*2;mkBoss(bx,by,Math.cos(a)*140,Math.sin(a)*140);}break;
    case'homing':for(let i=0;i<4;i++){const a=Math.atan2(dy,dx)+(i-1.5)*0.25;const b=mkBoss(bx,by,Math.cos(a)*60,Math.sin(a)*60);if(b){b._homing=true;b._homingLife=3.0;}}break;
    case'wave':for(let i=0;i<10;i++){const a=-Math.PI/2+(i-4.5)*0.15;mkBoss(bx,by,Math.cos(a)*spd,Math.sin(a)*spd);}break;
    case'spiral':for(let i=0;i<20;i++){const a=i/20*Math.PI*2+GAME.time*3;mkBoss(bx,by,Math.cos(a)*(100+i*5),Math.sin(a)*(100+i*5));}break;
    case'burst':for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const b=mkBoss(bx,by,Math.cos(a)*80,Math.sin(a)*80);if(b){b._expanding=true;b._expandSpd=200;}}break;
  }
  playSound('enemyShoot');
}

function onBossDeath(boss){
  spawnBossExplosion(boss.x,boss.y);playSound('bossDeath');
  GAME.bossActive=false;
  for(let i=0;i<GAME.enemies.length;i++){if(GAME.enemies[i].active&&GAME.enemies[i].type!=='boss')GAME.enemies[i].active=false;}
  for(let i=0;i<GAME.enemyBullets.length;i++)GAME.enemyBullets[i].active=false; // Clear all enemy bullets
  GAME.slowMotion=0.3;GAME.slowMotionTimer=1.5;
  for(let i=0;i<2;i++){const types=['spread','spread','spread','speed'];acquirePowerUp(boss.x-40+Math.random()*80,boss.y-10+Math.random()*40,types[Math.floor(Math.random()*types.length)]);}
  GAME.waveBossDead=true;
}

// ================================================================
// AUTO-TRIGGER SPECIAL EFFECTS (间隔触发: 闪电链/神龙摆尾/冲击波/流星雨/散射/侧方射击/冲击波)
// ================================================================
const AUTO_EFFECTS=['sweep','burst','meteor','scatter','sideShot'];
function updateAutoEffects(dt){
  if(GAME.bossWarning>0)return;
  // Decay per-effect cooldowns
  const cd=GAME._effectCooldowns;
  for(const k in cd)if(cd[k]>0)cd[k]-=dt;
  // Lightning fires independently when ready (alongside any effect)
  if((!cd['lightning']||cd['lightning']<=0)&&!GAME.lightningActive){
    GAME.lightningActive=true;GAME.lightningTimer=3.6;GAME.effectLightning=[];
    GAME.effectDisplayName=GAME.effectDisplayName||'闪电链';
    cd['lightning']=GAME._lightningBaseCooldown;
    GAME._lightningBaseCooldown=Math.max(0.1,GAME._lightningBaseCooldown*0.9);
    spawnComboText('闪电链',CANVAS_W/2,CANVAS_H/2-60);
  }
  // Other skills fire when no non-lightning effect is active
  if(!GAME.activeEffect){
    const others=AUTO_EFFECTS.filter(e=>e!=='lightning'&&(!cd[e]||cd[e]<=0));
    if(others.length>0){
      const eff=others[Math.floor(Math.random()*others.length)];
      triggerAutoEffect(eff);
      cd[eff]=6+Math.random()*2;
    }
  }
  // Lightning runs independently always
  if(GAME.lightningActive){
    GAME.lightningTimer-=dt;updateLightning(dt);
    if(GAME.lightningTimer<=0){GAME.lightningActive=false;GAME.effectLightning=[];}
  }
  // Other effects
  if(GAME.activeEffect){
    GAME.effectTimer-=dt;
    switch(GAME.activeEffect){
      case'sweep':updateSweep(dt);break;
      case'burst':updateBurst(dt);break;
      case'meteor':updateMeteors(dt);break;
      case'scatter':updateScatter(dt);break;
      case'sideShot':updateSideShot(dt);break;
    }
    if(GAME.effectTimer<=0){GAME.activeEffect=null;GAME.effectDisplayName='';GAME.effectMeteors=[];}
  }
}

function triggerAutoEffect(eff){
  GAME.activeEffect=eff;
  let name='';
  switch(eff){
    case'sweep':GAME.effectTimer=2.0;name='神龙摆尾';break;
    case'burst':GAME.effectTimer=1.2;GAME._burstWave=0;GAME._burstNext=0;name='冲击波';break;
    case'meteor':GAME.effectTimer=4.0;GAME.effectMeteors=[];name='流星雨';break;
    case'scatter':GAME.effectTimer=3.0;name='散射弹幕';break;
    case'sideShot':GAME.effectTimer=3.0;name='侧方射击';break;
  }
  GAME.effectDisplayName=name;
  spawnComboText(name,CANVAS_W/2,CANVAS_H/2-60);
  if(audioReady){const t=audioCtx.currentTime;const f=eff==='bomb'?60:(eff==='burst'?600:400);const v=createVoice('triangle',f,0);if(v){v.g.gain.setValueAtTime(0.15,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.3);v.osc.stop(t+0.35);}}
}

// 闪电链 — 从战机发射，链式跳跃，每次命中造成即时伤害
function updateLightning(dt){
  const p=GAME.player;if(!p||!p.active)return;
  const enemies=GAME.enemies.filter(e=>e.active);if(enemies.length<1)return;
  // Build chain starting from player
  const chain=[p];let curr=p;
  for(let step=0;step<6;step++){
    let nearest=null,minD=250;
    for(let i=0;i<enemies.length;i++){if(chain.includes(enemies[i]))continue;const d=Math.sqrt((enemies[i].x-curr.x)**2+(enemies[i].y-curr.y)**2);if(d<minD){minD=d;nearest=enemies[i];}}
    if(!nearest)break;chain.push(nearest);curr=nearest;
  }
  GAME.effectLightning=chain;
  // Apply instant damage to chained enemies (skip player at index 0)
  for(let i=1;i<chain.length;i++){chain[i].hp-=4*dt;spawnHitSparks(chain[i].x,chain[i].y,chain[i].x,chain[i].y);if(chain[i].hp<=0)onEnemyKilled(chain[i]);}
  // Annihilate enemy bullets within lightning radius
  for(let i=0;i<GAME.enemyBullets.length;i++){const b=GAME.enemyBullets[i];if(!b.active)continue;
    for(let j=1;j<chain.length;j++){if(Math.sqrt((b.x-chain[j].x)**2+(b.y-chain[j].y)**2)<60){b.active=false;acquireParticle(b.x,b.y,0,0,COLORS.starYellow,3,0.2);break;}}
  }
}

// 神龙摆尾 — sweeping beam bullets from player
function updateSweep(dt){
  const p=GAME.player;if(!p||!p.active)return;
  const t=GAME.effectTimer||0;
  const angle=Math.sin(t*8)*Math.PI*0.6-Math.PI/2;
  for(let i=0;i<7;i++){
    const a=angle-Math.PI*0.25+i*Math.PI*0.083;
    acquireBullet(GAME.playerBullets,p.x,p.y+10,Math.cos(a)*500,Math.sin(a)*500,2);
  }
}

// 冲击波 — 5 waves of 360° bullets
function updateBurst(dt){
  const p=GAME.player;if(!p||!p.active)return;
  GAME._burstNext=(GAME._burstNext||0)-dt;
  if(GAME._burstNext<=0&&(GAME._burstWave||0)<5){
    GAME._burstWave=(GAME._burstWave||0)+1;
    GAME._burstNext=0.2;
    const count=36+GAME._burstWave*10;
    for(let i=0;i<count;i++){const a=i/count*Math.PI*2+GAME._burstWave*0.25;acquireBullet(GAME.playerBullets,p.x,p.y,Math.cos(a)*(300+GAME._burstWave*80),Math.sin(a)*(300+GAME._burstWave*80),1);}
    GAME.screenShake=2+GAME._burstWave;GAME.screenShakeDuration=0.12;
    if(audioReady){const t=audioCtx.currentTime;const v=createVoice('triangle',400+GAME._burstWave*150,0);if(v){v.g.gain.setValueAtTime(0.12,t);v.g.gain.exponentialRampToValueAtTime(0.001,t+0.15);v.osc.stop(t+0.2);}}
  }
}

// 流星雨 — fireballs shoot upward from player
function updateMeteors(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*40&&GAME.effectMeteors.length<50){
    const a=-Math.PI/2+(Math.random()-0.5)*1.0; // upward spread
    GAME.effectMeteors.push({x:p.x,y:p.y-10,vx:Math.cos(a)*(300+Math.random()*400),vy:Math.sin(a)*(300+Math.random()*400),life:1.5});
  }
  for(let i=GAME.effectMeteors.length-1;i>=0;i--){
    const m=GAME.effectMeteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt;
    if(m.y<-50||m.y>CANVAS_H+50||m.x<-50||m.x>CANVAS_W+50||m.life<=0){GAME.effectMeteors.splice(i,1);continue;}
    for(let j=0;j<GAME.enemies.length;j++){const en=GAME.enemies[j];if(!en.active)continue;if(Math.sqrt((en.x-m.x)**2+(en.y-m.y)**2)<35){en.hp-=8;if(en.hp<=0)onEnemyKilled(en);m.life=0;break;}}
    if(Math.random()<0.5)acquireParticle(m.x,m.y,-m.vx*0.05,-m.vy*0.05,COLORS.coral,2+Math.random()*3,0.25);
  }
}

// 散射弹幕 — wide cone burst, fires rapidly for duration
function updateScatter(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*12){ // rapid fire
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(Math.random()-0.5)*1.2; // wide upward cone
      acquireBullet(GAME.playerBullets,p.x,p.y-10,Math.cos(a)*450,Math.sin(a)*450,1);
    }
  }
}

// 侧方射击 — bullets fire left and right simultaneously
function updateSideShot(dt){
  const p=GAME.player;if(!p||!p.active)return;
  if(Math.random()<dt*10){
    // Left side
    for(let i=-2;i<=2;i++){acquireBullet(GAME.playerBullets,p.x-16,p.y+i*8,-500,Math.sin(i*0.3)*80,1);}
    // Right side
    for(let i=-2;i<=2;i++){acquireBullet(GAME.playerBullets,p.x+16,p.y+i*8,500,Math.sin(i*0.3)*80,1);}
    // Up
    acquireBullet(GAME.playerBullets,p.x,p.y-16,0,-550,1);
  }
}

// Ambient enemy spawns between waves for roguelike non-stop action
let _ambientTimer=0;
function updateAmbientSpawns(dt){
  if(GAME.waveCleared||GAME.bossWarning>0||GAME.waveBossDead)return;
  if(GAME.waveBossDef&&!GAME.waveBossSpawned&&GAME.waveEnemyIndex>=GAME.waveSpawnQueue.length)return;
  _ambientTimer+=dt;
  // Ramp-up: slower first 10s, then ramps up
  const warmup=Math.min(1,GAME.waveTimer/10); // 0→1 over 10 seconds
  const baseInterval=Math.max(0.02,0.8-GAME.wave*0.1); // Scales even harder
  const interval=baseInterval/(0.3+warmup*0.7); // 3x slower at start
  if(_ambientTimer>=interval){
    _ambientTimer=0;
    const types=['basic','basic','fast','fast','swarmer','swarmer','tank'];
    if(GAME.wave>=2)types.push('swarmer','swarmer','swarmer');
    if(GAME.wave>=3)types.push('splitter','splitter');
    if(GAME.wave>=5)types.push('tank','tank','splitter');
    if(GAME.wave>=8)types.push('tank','tank','splitter','splitter','swarmer','swarmer');
    if(GAME.wave>=12)types.push('tank','tank','tank','splitter','splitter','splitter');
    const t=types[Math.floor(Math.random()*types.length)];
    const x=Math.random()*CANVAS_W;
    const patterns=['straight','sine','zigzag','charge','circle'];
    const e=acquireEnemy(x,-30,t);if(!e)return;
    const td=ENEMY_TYPES[t];const sc=1+(GAME.wave-1)*0.2;if(td){e.hp=Math.ceil(td.hp*sc);e.maxHp=e.hp;e.speed=td.speed;e.scoreValue=Math.ceil(td.score*sc);e.w=e.h=td.size;e.radius=td.size/2;e.canShoot=td.canShoot;e.shootInterval=td.shootInterval;}
    e.pattern=patterns[Math.floor(Math.random()*patterns.length)];
    e.patternData={patternTimer:0,startX:x,startY:-30};e._shootTimer=Math.random()*e.shootInterval;
    const groupChance=Math.min(0.9,(0.2+warmup*0.4)+GAME.wave*0.05); // Scales with wave
    if(Math.random()<groupChance){
      const groupSize=warmup<0.5?1:Math.min(6,2+Math.floor(GAME.wave/3)); // Grows with wave
      for(let s=0;s<groupSize;s++){
        const sx=Math.random()*CANVAS_W;const st=types[Math.floor(Math.random()*types.length)];
        const se=acquireEnemy(sx,-30-Math.random()*40,st);if(!se)continue;
        const sd=ENEMY_TYPES[st];const scl=1+(GAME.wave-1)*0.2;if(sd){se.hp=Math.ceil(sd.hp*scl);se.maxHp=se.hp;se.speed=sd.speed;se.scoreValue=Math.ceil(sd.score*scl);se.w=se.h=sd.size;se.radius=sd.size/2;se.canShoot=sd.canShoot;se.shootInterval=sd.shootInterval;}
        se.pattern=patterns[Math.floor(Math.random()*patterns.length)];se.patternData={patternTimer:0,startX:sx,startY:-30};se._shootTimer=Math.random()*se.shootInterval;
      }
    }
  }
}

// ============================================================================
// SECTION 10: POWER-UPS, SCORE & COMBO
// ============================================================================
function maybeDropPowerUp(x,y){
  const roll=Math.random();let t;
  if(roll<0.35)t='spread';else if(roll<0.45)t='shield';else if(roll<0.75)t='heal';else t='speed';
  acquirePowerUp(x,y,t);
}

function applyPowerUp(pu){
  if(!pu||!pu.active)return;pu.active=false;playSound('powerUp');
  const p=GAME.player;if(!p)return;
  switch(pu.type){
    case'spread':p.powerLevel=3;p._spreadTimer=10;break;
    case'shield':p._baseMaxHp=p._baseMaxHp||5;p.maxHp=p._baseMaxHp+1;p.hp=Math.min(p.hp+1,p.maxHp);p._shieldTimer=15;break;
    case'heal':p.hp=Math.min(p.hp+1,p.maxHp||5);break;
    case'speed':p._speedBoost=1.3;p._speedTimer=8;break;
  }
}

function addScore(base){
  if(GAME.gameState!=='playing')return;
  GAME.combo=(GAME.combo||0)+1;GAME.comboTimer=1.5;
  if(GAME.combo>GAME.maxCombo)GAME.maxCombo=GAME.combo;
  let mult=1;if(GAME.combo>=100)mult=10;else if(GAME.combo>=50)mult=5;else if(GAME.combo>=25)mult=3;else if(GAME.combo>=10)mult=2;
  GAME.score+=Math.floor(base*mult);checkMilestone(GAME.combo);
}

function checkMilestone(c){
  if(!GAME._comboMilestonesHit)GAME._comboMilestonesHit={};
  const m=GAME._comboMilestonesHit;
  if(c>=100&&!m[100]){m[100]=true;fireMilestone('完美!',100);}
  else if(c>=50&&!m[50]){m[50]=true;fireMilestone('惊人!',50);}
  else if(c>=25&&!m[25]){m[25]=true;fireMilestone('太棒了!',25);}
  else if(c>=10&&!m[10]){m[10]=true;fireMilestone('不错!',10);}
}

function fireMilestone(text,val){spawnComboText(text,CANVAS_W/2,300);sfxCombo(val);}
function updateComboTimer(dt){if(GAME.gameState!=='playing')return;if(GAME.comboTimer>0){GAME.comboTimer-=dt;if(GAME.comboTimer<=0){GAME.comboTimer=0;GAME.combo=0;GAME._comboMilestonesHit={};}}}

function checkPlayerDeath(dt){
  if(GAME.gameState!=='playing')return;if(!GAME._deathStarted)return;
  GAME._deathTimer-=dt;if(GAME._deathTimer<=0){gameOver();}
}

function startGame(){
  initPools();createPlayer();
  GAME.gameState='playing';GAME.score=0;GAME.combo=0;GAME.maxCombo=0;GAME.comboTimer=0;
  GAME._comboMilestonesHit={};GAME.slowMotion=1;GAME.slowMotionTimer=0;
  GAME.autoEffectTimer=1;GAME.activeEffect=null;GAME.effectDisplayName='';GAME.lightningActive=false;GAME.effectLightning=[];GAME.effectMeteors=[];
  GAME._effectCooldowns={lightning:0,sweep:0,burst:0,meteor:0,scatter:0,sideShot:0};
  GAME._lightningBaseCooldown=1.0;
  GAME.bossActive=false;GAME.bossWarning=0;GAME.bossWarningTimer=0;GAME._deathStarted=false;GAME._deathTimer=0;GAME._deathTriggered=false;
  GAME.screenShake=0;GAME.screenShakeDuration=0;GAME.flashAlpha=0;GAME.comboTexts=[];
  for(let i=0;i<GAME.enemyBullets.length;i++)GAME.enemyBullets[i].active=false;
  for(let i=0;i<GAME.playerBullets.length;i++)GAME.playerBullets[i].active=false;
  for(let i=0;i<GAME.enemies.length;i++)GAME.enemies[i].active=false;
  for(let i=0;i<GAME.powerUps.length;i++)GAME.powerUps[i].active=false;
  for(let i=0;i<GAME.particles.length;i++)GAME.particles[i].active=false;
  document.getElementById('start-screen').style.display='none';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('pause-overlay').style.display='none';
  _lastTime=performance.now();_accum=0;
  startWave(1);sfxMusicStart();
}

function gameOver(){
  if(GAME._deathTriggered)return;GAME._deathTriggered=true;
  GAME.gameState='gameover';sfxMusicStop();playSound('gameOver');
  for(let i=0;i<GAME.enemies.length;i++)GAME.enemies[i].active=false;
  for(let i=0;i<GAME.enemyBullets.length;i++)GAME.enemyBullets[i].active=false;
  for(let i=0;i<GAME.playerBullets.length;i++)GAME.playerBullets[i].active=false;
  document.getElementById('final-score').textContent='分数: '+formatScore(GAME.score);
  document.getElementById('final-stats').textContent='波次 '+GAME.wave+' · 最大连击 '+GAME.maxCombo+'x';

}
let planets=[];
function drawBg(ctx){
  if(!starsInit)initStars();
  const grad=ctx.createLinearGradient(0,0,0,CANVAS_H);grad.addColorStop(0,'#1A0A3E');grad.addColorStop(0.5,'#2D1B4E');grad.addColorStop(1,'#0F0530');ctx.fillStyle=grad;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

function drawPlanets(ctx,t){
  planets=planets.filter(p=>p.y<900);
  const ss=Math.floor(t*0.15);
  if(planets.length===0||planets[planets.length-1].y>300){if(((ss*17+31)%100)<8&&planets.length<3){const isRing=((ss*7+13)%3)!==0;planets.push({type:isRing?'ring':'moon',x:40+((ss*41+67)%400),y:-60,size:isRing?25+((ss*13)%20):18+((ss*23)%16),spd:0.4+((ss*11)%10)*0.06,ringAngle:((ss*29)%60-30)*Math.PI/180});}}
  for(let i=0;i<planets.length;i++){const p=planets[i];p.y+=p.spd;if(p.type==='ring')drawRingPlanet(ctx,p);else drawMoonPlanet(ctx,p);}

// Helper: 5-point star path (for fill+stroke)
function drawStar5Path(ctx,cx,cy,outerR,innerR,rotation){
  ctx.beginPath();const pts=5,step=Math.PI/pts;

  ctx.closePath();
}

function drawEnemyBullet(ctx,bullet){
  const x=bullet.x,y=bullet.y;
  const sz=bullet._bossBullet?2:1;
  if(bullet._homing){
    // Homing bullet: red with pulsing glow (boss size)
    const rs=sz*8;const g=ctx.createRadialGradient(x,y,1,x,y,rs);g.addColorStop(0,rgba('#FF4444',0.9));g.addColorStop(0.5,rgba('#FF0000',0.6));g.addColorStop(1,rgba('#FF0000',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rs,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF8888';ctx.beginPath();ctx.arc(x,y,3.5*sz,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.arc(x-0.5*sz,y-0.5*sz,1.2*sz,0,Math.PI*2);ctx.fill();
  }else if(bullet._bossBullet){
    // Boss bullet: larger with glow
    const g=ctx.createRadialGradient(x,y,1,x,y,10);g.addColorStop(0,rgba(COLORS.hotPink,0.8));g.addColorStop(0.5,rgba(COLORS.hotPink,0.4));g.addColorStop(1,rgba(COLORS.hotPink,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
    const m=ctx.createRadialGradient(x-2,y-2,0.5,x,y,5);m.addColorStop(0,COLORS.white);m.addColorStop(0.3,COLORS.hotPink);m.addColorStop(1,COLORS.darkPink);ctx.fillStyle=m;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.arc(x-1,y-1,1.5,0,Math.PI*2);ctx.fill();
  }else{
    const g=ctx.createRadialGradient(x,y,1,x,y,6);g.addColorStop(0,rgba(COLORS.hotPink,0.7));g.addColorStop(1,rgba(COLORS.hotPink,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();
    const m=ctx.createRadialGradient(x-1,y-1.5,0.5,x,y,3);m.addColorStop(0,COLORS.white);m.addColorStop(0.3,COLORS.hotPink);m.addColorStop(1,COLORS.darkPink);ctx.fillStyle=m;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.arc(x-0.5,y-0.5,1,0,Math.PI*2);ctx.fill();
  }
}

function drawPowerUp(ctx,pu){
  ctx.save();ctx.translate(pu.x,pu.y);const t=GAME.time||0,bob=Math.sin(t*4)*3;ctx.translate(0,bob);
  let gc,ic;switch(pu.type){case'spread':gc=COLORS.skyBlue;ic=COLORS.skyBlue;break;case'shield':gc=COLORS.lavender;ic=COLORS.lavender;break;case'heal':gc=COLORS.pink;ic=COLORS.hotPink;break;case'speed':gc=COLORS.gold;ic=COLORS.gold;break;default:gc=COLORS.mint;ic=COLORS.mint;}
  ctx.fillStyle=rgba(gc,0.2+0.1*Math.sin(t*3));ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.strokeStyle=gc;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=ic;
  switch(pu.type){
    case'spread':drawStar5(ctx,-3,0,3,1.3,ic,1,0);drawStar5(ctx,4,-2,3,1.3,ic,1,0);drawStar5(ctx,4,3,3,1.3,ic,1,0);break;
    case'shield':ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(5.5,-3);ctx.lineTo(5.5,2);ctx.quadraticCurveTo(2.5,6.5,0,7.5);ctx.quadraticCurveTo(-2.5,6.5,-5.5,2);ctx.lineTo(-5.5,-3);ctx.closePath();ctx.fill();break;
    case'heal':roundRect(ctx,-1.5,-5,3,10,1);ctx.fill();roundRect(ctx,-5,-1.5,10,3,1);ctx.fill();break;
    case'speed':ctx.beginPath();ctx.moveTo(0,-6.5);ctx.lineTo(-3,0);ctx.lineTo(0,0);ctx.lineTo(-2,6.5);ctx.lineTo(3.5,-1);ctx.lineTo(0,-1);ctx.lineTo(2,-6.5);ctx.closePath();ctx.fill();break;
  }
  ctx.fillStyle=rgba(COLORS.white,0.5);ctx.beginPath();ctx.arc(-3,-3,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawParticle(ctx,p){
  const lr=p.life/p.maxLife,sz=p.size*lr,alpha=(p.alpha||1)*lr;if(alpha<0.01)return;
  if(p.isStar){drawStar4(ctx,p.x,p.y,sz*1.5,p.color,alpha);ctx.fillStyle=rgba(p.color,alpha*0.3);ctx.beginPath();ctx.arc(p.x,p.y,sz*2,0,Math.PI*2);ctx.fill();}
  else if(p.isSpark){const sg=ctx.createRadialGradient(p.x,p.y,sz*0.2,p.x,p.y,sz*2.5);sg.addColorStop(0,rgba(p.color,alpha));sg.addColorStop(0.5,rgba(p.color,alpha*0.4));sg.addColorStop(1,rgba(p.color,0));ctx.fillStyle=sg;ctx.beginPath();ctx.arc(p.x,p.y,sz*2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(COLORS.white,alpha);ctx.beginPath();ctx.arc(p.x,p.y,sz*0.7,0,Math.PI*2);ctx.fill();}
  else if(p.isRing){ctx.strokeStyle=rgba(p.color,alpha);ctx.lineWidth=sz*0.5;ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.stroke();}
  else{ctx.fillStyle=rgba(p.color,alpha*0.2);ctx.beginPath();ctx.arc(p.x,p.y,sz*1.6,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(p.color,alpha);ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(COLORS.white,alpha*0.6);ctx.beginPath();ctx.arc(p.x,p.y,sz*0.35,0,Math.PI*2);ctx.fill();}
}

function drawSkillCooldowns(ctx){
  const skills=[
    {name:'闪电链',key:'lightning',color:'#FFE156'},
    {name:'神龙摆尾',key:'sweep',color:'#00D4FF'},
    {name:'冲击波',key:'burst',color:'#FF6B8A'},
    {name:'流星雨',key:'meteor',color:'#FF9AA2'},
    {name:'散射弹幕',key:'scatter',color:'#B5EAD7'},
    {name:'侧方射击',key:'sideShot',color:'#C7CEEA'},
  ];
  const barW=90,barH=6,gap=6,x0=CANVAS_W/2-((skills.length*barW+(skills.length-1)*gap)/2),y0=CANVAS_H-14;
  skills.forEach((s,i)=>{
    const sx=x0+i*(barW+gap);
    const cd=GAME._effectCooldowns[s.key]||0;
    const maxCd=s.key==='lightning'?GAME._lightningBaseCooldown:8;
    const ratio=1-Math.min(1,cd/maxCd);
    // Background
    ctx.fillStyle='rgba(0,0,0,0.5)';roundRect(ctx,sx,y0,barW,barH,3);ctx.fill();
    // Fill
    if(ratio>0){ctx.fillStyle=s.color;roundRect(ctx,sx,y0,barW*ratio,barH,3);ctx.fill();}
    // Border
    ctx.strokeStyle=ratio>=1?'rgba(255,255,255,0.6)':'rgba(255,255,255,0.2)';ctx.lineWidth=0.5;roundRect(ctx,sx,y0,barW,barH,3);ctx.stroke();
    // Label
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 8px "Segoe UI","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(s.name,sx+barW/2,y0-2);
  });
}

function drawBossWarning(ctx){
  if(GAME.bossWarning>0){const p=0.5+0.5*Math.sin(GAME.time*8),a=GAME.bossWarning*p;ctx.strokeStyle=rgba(COLORS.coral,a);ctx.lineWidth=4;ctx.strokeRect(2,2,CANVAS_W-4,CANVAS_H-4);if(a>0.4){ctx.fillStyle=rgba(COLORS.coral,a);ctx.font='bold 28px "Segoe UI","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.shadowColor=COLORS.deepBlue;ctx.shadowBlur=10;ctx.fillText('警告',CANVAS_W/2,CANVAS_H/2-10);ctx.shadowBlur=0;ctx.fillStyle=rgba(COLORS.starYellow,a*0.8);ctx.font='bold 16px "Segoe UI","Microsoft YaHei",sans-serif';ctx.fillText('BOSS 来袭!',CANVAS_W/2,CANVAS_H/2+20);}}
}

function drawSkillBar_removed(ctx){
  const skills=[
    {cooldown:GAME.skill1Cooldown,max:GAME.skill1CooldownMax,label:'[1] 激光',color:'#00D4FF',color2:'#7B2FFF'},
    {cooldown:GAME.skill2Cooldown,max:GAME.skill2CooldownMax,label:'[2] 炸弹',color:'#FF6B8A',color2:'#FF9AA2'},
    {cooldown:GAME.skill3Cooldown,max:GAME.skill3CooldownMax,label:'[3] 护盾',color:'#C7CEEA',color2:'#B5EAD7'},
  ];
  const barW=80,barH=7,gap=10,totalW=skills.length*barW+(skills.length-1)*gap;
  let sx=CANVAS_W/2-totalW/2,sy=CANVAS_H-20;
  skills.forEach(s=>{
    const ratio=1-(s.cooldown/s.max);
    ctx.fillStyle='rgba(0,0,0,0.5)';roundRect(ctx,sx-1,sy-1,barW+2,barH+2,3);ctx.fill();
    ctx.fillStyle=COLORS.charcoal;roundRect(ctx,sx,sy,barW,barH,3);ctx.fill();
    if(ratio>0){const g=ctx.createLinearGradient(sx,0,sx+barW,0);g.addColorStop(0,s.color);g.addColorStop(1,s.color2);ctx.fillStyle=g;roundRect(ctx,sx,sy,barW*ratio,barH,3);ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=0.8;roundRect(ctx,sx,sy,barW,barH,3);ctx.stroke();
    ctx.fillStyle=rgba(COLORS.white,0.8);ctx.font='bold 8px "Segoe UI","Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(s.label,sx+barW/2,sy-3);
    if(ratio>=1)ctx.fillText('OK',sx+barW/2,sy-12);
    sx+=barW+gap;
  });
}

function drawShieldBubble(ctx){
  const p=GAME.player;if(!p||!p.active)return;
  const a=(GAME.skill3Timer/3)*0.25+0.1*Math.sin(GAME.time*6);
  ctx.strokeStyle=rgba(COLORS.lavender,a);ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(p.x,p.y,30+Math.sin(GAME.time*8)*3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=rgba(COLORS.skyBlue,a*0.3);ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.fill();
}

// 闪电链渲染 — 从战机发射
function drawLightningEffect(ctx){
  const chain=GAME.effectLightning;if(!chain||chain.length<2)return;
  ctx.save();ctx.globalAlpha=0.9;
  // Draw thick main bolt
  ctx.strokeStyle='#FFFFFF';ctx.lineWidth=4;ctx.shadowColor='#FFE156';ctx.shadowBlur=15;
  for(let i=0;i<chain.length-1;i++){
    const a=chain[i],b=chain[i+1];ctx.beginPath();ctx.moveTo(a.x,a.y);
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy),seg=Math.max(3,Math.floor(dist/15));
    for(let s=1;s<=seg;s++){ctx.lineTo(a.x+dx*s/seg+(Math.random()-0.5)*25,a.y+dy*s/seg+(Math.random()-0.5)*25);}
    ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // Draw thinner colored bolt on top
  ctx.strokeStyle='#FFE156';ctx.lineWidth=2;ctx.shadowBlur=8;
  for(let i=0;i<chain.length-1;i++){
    const a=chain[i],b=chain[i+1];ctx.beginPath();ctx.moveTo(a.x,a.y);
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy),seg=Math.max(3,Math.floor(dist/15));
    for(let s=1;s<=seg;s++){ctx.lineTo(a.x+dx*s/seg+(Math.random()-0.5)*15,a.y+dy*s/seg+(Math.random()-0.5)*15);}
    ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.restore();
}

// 神龙摆尾效果 — horizontal beam line from player
function drawSweepEffect(ctx){
  const p=GAME.player;if(!p||!p.active)return;
  const a=Math.sin(GAME.time*8)*Math.PI*0.6;ctx.save();ctx.globalAlpha=0.5;
  ctx.strokeStyle='#00D4FF';ctx.lineWidth=2;ctx.shadowColor='#00D4FF';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(a-Math.PI*0.5)*500,p.y+Math.sin(a-Math.PI*0.5)*500);ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(a+Math.PI*0.5)*500,p.y+Math.sin(a+Math.PI*0.5)*500);ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}

// 流星雨渲染
function drawMeteorEffect(ctx){
  for(let i=0;i<GAME.effectMeteors.length;i++){
    const m=GAME.effectMeteors[i];
    // Fireball
    const g=ctx.createRadialGradient(m.x,m.y,2,m.x,m.y,12);g.addColorStop(0,COLORS.white);g.addColorStop(0.3,COLORS.gold);g.addColorStop(0.7,COLORS.coral);g.addColorStop(1,'rgba(255,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,12,0,Math.PI*2);ctx.fill();
    // Trail
    ctx.strokeStyle=rgba(COLORS.coral,0.4);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*0.05,m.y-m.vy*0.05);ctx.stroke();
  }
}

// ============================================================================
// SECTION 15: HELPER DRAWING FUNCTIONS
// ============================================================================
function rgba(hex,alpha){if(alpha>=1)return hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+alpha.toFixed(3)+')';}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawHeart(ctx,cx,cy,size,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;const s=size*0.5;
  ctx.beginPath();ctx.moveTo(cx,cy+s*1.4);ctx.bezierCurveTo(cx-s*1.3,cy+s*0.5,cx-s*1.3,cy-s*0.5,cx,cy-s*0.2);ctx.bezierCurveTo(cx+s*1.3,cy-s*0.5,cx+s*1.3,cy+s*0.5,cx,cy+s*1.4);ctx.closePath();ctx.fill();ctx.restore();
}

function drawStar4(ctx,cx,cy,size,color,alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;const hw=size*0.35,hh=size;
  ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx+hw*0.3,cy-hw*0.2);ctx.lineTo(cx+hw,cy);ctx.lineTo(cx+hw*0.3,cy+hw*0.2);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx-hw*0.3,cy+hw*0.2);ctx.lineTo(cx-hw,cy);ctx.lineTo(cx-hw*0.3,cy-hw*0.2);ctx.closePath();ctx.fill();ctx.restore();
}

function drawStar5(ctx,cx,cy,outerR,innerR,color,rotation){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation||0);ctx.fillStyle=color;
  ctx.beginPath();const pts=5,step=Math.PI/pts;
  for(let i=0;i<pts*2;i++){const r=i%2===0?outerR:innerR,a=i*step-Math.PI/2;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.restore();
}

function drawHpBar(ctx,x,y,w,hp,maxHp){
  if(maxHp<=0)return;ctx.fillStyle='rgba(0,0,0,0.5)';roundRect(ctx,x-w/2-1,y-1,w+2,7,2);ctx.fill();
  ctx.fillStyle=COLORS.coral;roundRect(ctx,x-w/2,y,w,5,2);ctx.fill();
  const ratio=Math.max(0,Math.min(1,hp/maxHp));if(ratio>0){ctx.fillStyle=COLORS.mint;roundRect(ctx,x-w/2,y,w*ratio,5,2);ctx.fill();}
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=0.8;roundRect(ctx,x-w/2,y,w,5,2);ctx.stroke();
}

function formatScore(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.floor(n));}

// ============================================================================
// SECTION 16: MAIN RENDER FUNCTION
// ============================================================================
function render(){
  const canvas=document.getElementById('gameCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  // Screen shake offset
  let sx=0,sy=0;if(GAME.screenShake>0&&GAME.screenShakeDuration>0){sx=(Math.random()-0.5)*GAME.screenShake*2;sy=(Math.random()-0.5)*GAME.screenShake*2;}
  ctx.save();ctx.translate(sx,sy);
  drawBg(ctx);
  // Enemies
  for(let i=0;i<GAME.enemies.length;i++){const e=GAME.enemies[i];if(e.active)drawEnemy(ctx,e);}
  // Player bullets
  for(let i=0;i<GAME.playerBullets.length;i++){const b=GAME.playerBullets[i];if(b.active)drawPlayerBullet(ctx,b.x,b.y);}
  // Enemy bullets
  for(let i=0;i<GAME.enemyBullets.length;i++){const b=GAME.enemyBullets[i];if(b.active)drawEnemyBullet(ctx,b);}
  // Power-ups
  for(let i=0;i<GAME.powerUps.length;i++){const p=GAME.powerUps[i];if(p.active)drawPowerUp(ctx,p);}
  // Player
  if(GAME.player&&GAME.player.active){drawPlayer(ctx,GAME.player.x,GAME.player.y);
    // Shield bubble visual
    if(GAME.player._shieldTimer>0||GAME.player.invincible>0){
      const a=(GAME.player.invincible>0?0.5:0.3)+0.1*Math.sin(GAME.time*6);
      ctx.strokeStyle=rgba(COLORS.lavender,a);ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(GAME.player.x,GAME.player.y,14+Math.sin(GAME.time*8)*2,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=rgba(COLORS.skyBlue,a*0.2);
      ctx.beginPath();ctx.arc(GAME.player.x,GAME.player.y,14,0,Math.PI*2);ctx.fill();
    }
  }
  // Particles
  for(let i=0;i<GAME.particles.length;i++){const p=GAME.particles[i];if(p.active)drawParticle(ctx,p);}
  ctx.restore();
  // Auto-trigger effect visuals
  if(GAME.lightningActive)drawLightningEffect(ctx);
  if(GAME.activeEffect==='sweep')drawSweepEffect(ctx);
  if(GAME.activeEffect==='meteor')drawMeteorEffect(ctx);
  // HUD
  drawHUD(ctx);drawComboTexts(ctx);drawScreenFlash(ctx);drawBossWarning(ctx);drawSkillCooldowns(ctx);
  // Pause overlay
  document.getElementById('pause-overlay').style.display=GAME.gameState==='paused'?'flex':'none';
}

// ============================================================================
// SECTION 17: STARTUP & EVENT HANDLERS
// ============================================================================
function drawPreviewShip(){
  const c=document.getElementById('previewCanvas');if(!c)return;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,80,80);
  // Mini version of player ship
  ctx.save();ctx.translate(40,44);
  // Engine
  ctx.fillStyle=rgba(COLORS.mint,0.7);ctx.beginPath();ctx.arc(0,16,5,0,Math.PI*2);ctx.fill();
  // Body
  const bg=ctx.createRadialGradient(-1,-3,1,0,0,14);bg.addColorStop(0,COLORS.softWhite);bg.addColorStop(0.3,COLORS.blushPink);bg.addColorStop(0.7,COLORS.pink);bg.addColorStop(1,COLORS.roseGold);ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(0,-15);ctx.bezierCurveTo(12,-14,14,-4,13,6);ctx.bezierCurveTo(11,13,6,15,0,15);ctx.bezierCurveTo(-6,15,-11,13,-13,6);ctx.bezierCurveTo(-14,-4,-12,-14,0,-15);ctx.closePath();ctx.fill();
  // Ears
  ctx.fillStyle=COLORS.hotPink;ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-14,-17);ctx.lineTo(-5,-13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,-7);ctx.lineTo(14,-17);ctx.lineTo(5,-13);ctx.closePath();ctx.fill();
  // Eyes
  ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.ellipse(-3.5,-3,4,4.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(3.5,-3,4,4.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COLORS.darkPurple;ctx.beginPath();ctx.arc(-3,-2.5,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3,-2.5,2.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=COLORS.white;ctx.beginPath();ctx.arc(-4,-4.5,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(2,-4.5,1,0,Math.PI*2);ctx.fill();
  // Blush
  ctx.fillStyle=rgba(COLORS.coral,0.4);ctx.beginPath();ctx.ellipse(-5,1,2.5,1.8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(5,1,2.5,1.8,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// Click handlers
function handleStartClick(){initAudio();if(GAME.gameState==='start'||GAME.gameState==='gameover')startGame();}
function handleRestartClick(){restartGame();}

// Canvas auto-scales via CSS (max-width:100vw, max-height:100vh, object-fit:contain)

// Initialization
window.onload=function(){
  initPools();initInput();createPlayer();initGameLoop();drawPreviewShip();
  // Show start screen
  document.getElementById('start-screen').style.display='flex';
  document.getElementById('gameover-screen').style.display='none';
  document.getElementById('pause-overlay').style.display='none';
};
</script>
